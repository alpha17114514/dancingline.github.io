        else{await AudioEngine.load(songKey);
          // 优先从 levels/ 文件夹加载 (离线ZIP), 其次内嵌关卡, 最后自动生成
          level=await loadLevelFromFile(songKey);
          if(!level&&EmbeddedLevels[songKey])level=Schema.validate(JSON.parse(JSON.stringify(EmbeddedLevels[songKey])));
          if(!level)level=generateDemoLevel(songKey,AudioEngine.duration);
        }
      }
      await AudioEngine.load(songKey);
    }catch(e){console.error('startPlay error:',e);toast(e.message||'音频加载失败，请重试',8000);UI.showMenu();return;}
    level.meta.durationSec=AudioEngine.duration;
    this._currentRouteId=routeId||null;
    Sim.reset(level,autoplay,routeId);this._autoplay=autoplay;
    Play.leadIn=level.audio.leadInSec||3.0;
    Play.audioOffset=level.audio.audioOffset||0;
    Play.ready();
    // 设置相机到起点(含前瞻),路面立即可见
    const snap=Sim.getState(Play.gameTime);
    Renderer.snapCam(snap.head[0]+snap.dir[0]*Config.camLookahead,snap.head[1]+snap.dir[1]*Config.camLookahead);
    document.getElementById('pause').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');
    AudioEngine.stopAll();await AudioEngine.resumeCtx();
    UI.show('hud');document.getElementById('play-hint').classList.remove('hidden');
    // 显示"点击开始"提示
    this._showReady();
  },
  _showReady(){
    const el=document.getElementById('countdown');el.classList.remove('hidden');
    const num=el.querySelector('.num');
    num.textContent='点击开始';
    num.style.fontSize='clamp(28px,6vw,56px)';
    num.style.animation='none';void num.offsetWidth;num.style.animation='pulse 2s ease-in-out infinite';
  },
  loop(t){
    const dt=clamp((t-this.lastRaf)/1000,0,0.1);this.lastRaf=t;
    if(this.mode==='play'){
      Play.update(dt);
      const T=Play.gameTime;
      const snap=Sim.getState(T);
      Renderer.render(snap,'play');UI.refreshHud(snap);
    } else if(this.mode==='editor'){
      const T=AudioEngine.musicTime;
      Editor.update(T,dt);
    } else {Renderer.ctx&&this._menuBg(dt);}
    requestAnimationFrame((tt)=>this.loop(tt));
  },
  _menuBg(dt){
    const ctx=Renderer.ctx,W=Renderer.W,H=Renderer.H;
    ctx.fillStyle='rgba(5,6,10,0.3)';ctx.fillRect(0,0,W,H);
    if(!this._stars){this._stars=[];for(let i=0;i<80;i++)this._stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.3,s:Math.random()*30+10});}
    const t=performance.now()/1000;ctx.globalCompositeOperation='lighter';
    for(const s of this._stars){const a=0.3+0.3*Math.sin(t*s.s*0.3+s.x);ctx.globalAlpha=a;ctx.fillStyle=Config.cyan;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
};

/* ===== Input ===== */
const Input={
  bind(){
    window.addEventListener('keydown',(e)=>this.onKey(e),false);
    const stage=document.getElementById('stage');
    stage.addEventListener('pointerdown',(e)=>{e.preventDefault();this.onPointer(e);},false);
  },
  onKey(e){
    if(e.repeat)return;
    if(Game.mode==='play'){
      if(Play.state==='ready'){
        if(e.code==='Space'||e.code==='Enter'){e.preventDefault();Play.begin();}
      }else if(Play.state==='playing'){
        if(e.code==='Space'||e.code==='Enter'){e.preventDefault();Play.onTurn();}
        else if(e.code==='Escape'){Play.pauseToggle();}
        else if(e.code==='KeyR'){Play.restart();}
      }else if(Play.state==='paused'){
        if(e.code==='Escape'){Play.resume();}
      }
    }else if(Game.mode==='editor'){Editor.onKey(e);}
  },
  onPointer(e){
    if(Game.mode==='play'){
      if(Play.state==='ready'){Play.begin();}
      else if(Play.state==='playing'){Play.onTurn();}
    }
    else if(Game.mode==='editor'){Editor.onStagePointer(e);}
  }
};

/* ===== Play ===== */
const Play={
  state:'idle',          // idle, ready, playing, paused, dead, complete
  gameTime:0,            // 游戏时间, 从 -leadIn 开始递增
  musicStarted:false,    // 音乐是否已开始
  leadIn:3.0,            // 线移动多久后开始播放音乐
  audioOffset:0,         // 音频偏移: 正=音乐延迟, 负=音乐提前
  ready(){
    this.state='ready';this.gameTime=-this.leadIn;this.musicStarted=false;
  },
  begin(){
    this.state='playing';this.gameTime=-this.leadIn;this.musicStarted=false;
    document.getElementById('countdown').classList.add('hidden');
  },
  onTurn(){
    if(this.state!=='playing')return;
    const T=this.gameTime;
    const ok=Sim.onTurn(T);
    if(ok)Sim.spawnParticles(Sim.head[0],Sim.head[1],Config.cyan,8);
  },
  update(dt){
    Sim.updateParticles(dt);
    if(this.state!=='playing')return;
    this.gameTime+=dt;
    // 音频偏移: 音乐在 gameTime >= audioOffset 时开始
    if(!this.musicStarted&&this.gameTime>=this.audioOffset){
      this.musicStarted=true;
      // 若 audioOffset < 0, 音乐已"开始"了一段时间, 需跳到 |offset| 位置
      const startPos=Math.max(0,-this.audioOffset);
      AudioEngine.play(startPos);
    }
    const T=this.gameTime;
    if(!Sim.autoplay&&Sim.checkCollision(T)){this.die();return;}
    // 检查收集物
    const colResult=Sim.checkCollectibles(T);
    if(colResult.diamond!==undefined)UI.toastCollect('💎 钻石');
    if(colResult.crown!==undefined)UI.toastCollect('👑 皇冠');
    if(colResult.checkpoint!==undefined)UI.toastCollect('🏁 存档点');
    const snap=Sim.getState(T);
    Sim.prevHead=snap.head.slice();Sim.head=snap.head.slice();Sim.dir=snap.dir;
    const cam=Sim.level.camera;
    if(cam.mode==='keyframe'&&cam.keyframes.length>1){
      const c=Camera.eval(cam.keyframes,T);
      if(c){Renderer.cam.x=c.x;Renderer.cam.y=c.y;Config.zoom=c.zoom;}
    }else{
      Renderer.setCam(snap.head[0]+snap.dir[0]*Config.camLookahead,snap.head[1]+snap.dir[1]*Config.camLookahead);
    }
    // 通关判定: 音乐播放完毕 (双重检测, 防止 onended 未触发导致卡住)
    if(this.musicStarted){
      const mt=AudioEngine.musicTime;
      // 方式1: musicTime 达到接近末尾
      const musicDone=mt>=AudioEngine.duration-0.05;
      // 方式2: gameTime 超过音乐时长+1秒 (兜底, 防止 onended 未触发)
      const gameDone=this.gameTime>=AudioEngine.duration+1.0;
      if(musicDone||gameDone)this.complete();
    }
  },
  die(){this.state='dead';if(this.musicStarted)AudioEngine.pause();Sim.alive=false;Renderer.shake=16;
    Sim.spawnParticles(Sim.head[0],Sim.head[1],Config.magenta,40);
    // 如果有存档点, 显示存档点复活选项
    const cpT=Sim.getCheckpointTime();
    this._canRevive=cpT>0;
    setTimeout(()=>this.showResult(false),500);},
  complete(){this.state='complete';if(this.musicStarted)AudioEngine.pause();Sim.completed=true;setTimeout(()=>this.showResult(true),300);},
  showResult(win){
    document.getElementById('result-title').textContent=win?'通关！':'游戏结束';
    const prog=Math.round(clamp(this.gameTime/AudioEngine.duration,0,1)*100);
    document.getElementById('result-progress').textContent=(win?100:prog)+'%';
    // 显示收集物统计
    const col=Sim.level&&Sim.level.collectibles;
    const dTotal=col&&col.diamonds?col.diamonds.length:0;
    const dGot=Sim.collectedDiamonds.size;
    const cGot=Sim.crownCollected;
    const scoreEl=document.getElementById('result-score');
    scoreEl.classList.remove('hidden');
    scoreEl.innerHTML='<div style="margin:8px 0;font-size:16px">💎 钻石 '+dGot+'/'+dTotal+(cGot?' · 👑 皇冠已收集':'')+'</div>';
    document.getElementById('result-combo').parentElement.classList.add('hidden');
    document.getElementById('best-line').classList.add('hidden');
    document.getElementById('btn-result-quit').textContent=Game._editorReturn?'返回编辑器':'返回菜单';
    // 存档点复活按钮
    const reviveBtn=document.getElementById('btn-revive');
    if(reviveBtn){
      const cpT=Sim.getCheckpointTime();
      reviveBtn.style.display=(!win&&cpT>0&&this._canRevive)?'inline-block':'none';
    }
    UI.show('result');
  },
  pauseToggle(){if(this.state==='playing')this.pause();else if(this.state==='paused')this.resume();},
  pause(){if(this.state!=='playing')return;this.state='paused';
    if(this.musicStarted)AudioEngine.pause();
    document.getElementById('btn-quit').textContent=Game._editorReturn?'返回编辑器':'退出';
    document.getElementById('pause').classList.remove('hidden');},
  async resume(){if(this.state!=='paused')return;document.getElementById('pause').classList.add('hidden');
    this.state='playing';
    if(this.musicStarted){await AudioEngine.resumeCtx();AudioEngine.resume();}},
  restart(){
    document.getElementById('pause').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');
    const rid=Game._currentRouteId||null;
    if(Game._editorReturn)Game.startPlay(Sim.level.meta.songKey,true,false,rid);
    else Game.startPlay(Sim.level.meta.songKey,false,false,rid);
  },
  revive(){
    document.getElementById('result').classList.add('hidden');
    const cpT=Sim.getCheckpointTime();
    if(cpT<=0){this.restart();return;}
    // 从存档点恢复: 保留收集物状态, 回退到存档点时间
    this.gameTime=cpT;this.state='playing';
    Sim.alive=true;
    // 回退玩家路径到存档点
    Sim.playerTurns=Sim.playerTurns.filter(t=>t.t<cpT);
    Sim._rebuildPlayer();
    const snap=Sim.getState(cpT);
    Sim.prevHead=snap.head.slice();Sim.head=snap.head.slice();Sim.dir=snap.dir;
    if(this.musicStarted){AudioEngine.seek(cpT);AudioEngine.resume();}
    Renderer.snapCam(snap.head[0],snap.head[1]);
    toast('从存档点继续');
  }
};

/* ===== Store (v3) ===== */
const Store={
  KEY:'dancing-line-v3',
  OLD_KEY:'dancing-line-v2',
  data:{best:{},levels:{},editorAutosave:null},
  load(){
    try{const s=localStorage.getItem(this.KEY);if(s)this.data=JSON.parse(s);}catch(e){}
    if(!this.data.best||Object.keys(this.data.best).length===0){
      try{const old=JSON.parse(localStorage.getItem(this.OLD_KEY)||'{}');
        if(old&&old.best)this.data.best=old.best;}catch(e){}
    }
  },
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){}},
  getBest(k){return this.data.best[k]||0;},setBest(k,v){this.data.best[k]=v;this.save();},
  getLevel(k){return this.data.levels[k]||null;},setLevel(k,l){this.data.levels[k]=l;this.save();},
  autosave(l){this.data.editorAutosave=l;this.save();},getAutosave(){return this.data.editorAutosave;}
};

/* ===== Editor (v3: 铺路机模式) ===== */
const Editor={
  level:null,songKey:null,dirty:false,playing:false,_demoMode:false,
  tlCanvas:null,tlCtx:null,tlW:0,tlH:0,
  cam:{x:0,y:0,zoom:0.6},_bound:false,tlDrag:null,drag:null,
  paverMode:true,camMode:false,dragMode:false,diamondMode:false,checkpointMode:false,crownMode:false,activeRouteId:'r0',
  width:Config.defaultHalfWidth,selectedTurnIdx:-1,
  enter(songKey){
    this.songKey=songKey;this.level=Store.getLevel(songKey);Game.mode='editor';
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('editor-bar').classList.add('active');
    document.getElementById('ed-params').classList.add('active');
    document.getElementById('ed-stats').classList.add('active');
    document.getElementById('edit-hint').classList.remove('hidden');
    document.getElementById('timeline').style.display='block';
    document.getElementById('stage').classList.add('editor-canvas-offset');
    Renderer.resize();
    document.getElementById('editor-song').textContent='编辑 · '+songKey;
    this.tlCanvas=document.getElementById('timeline');this.tlCtx=this.tlCanvas.getContext('2d');
    this.resize();this.bindCanvas();
    AudioEngine.resumeCtx().then(()=>AudioEngine.load(songKey)).then(async()=>{
      if(!this.level){
        const auto=Store.getAutosave();
        if(auto&&auto.meta.songKey===songKey)this.level=Schema.validate(auto);
        else{
          // 优先从 levels/ 文件夹加载, 其次内嵌关卡, 最后空白关卡
          this.level=await loadLevelFromFile(songKey);
          if(!this.level&&EmbeddedLevels[songKey])this.level=Schema.validate(JSON.parse(JSON.stringify(EmbeddedLevels[songKey])));
          if(!this.level)this.level=this._blankLevel(songKey,AudioEngine.duration);
        }
      }
      this.level=Schema.validate(this.level);
      this.level.meta.durationSec=AudioEngine.duration;
      this.activeRouteId=this.level.routes[0].id;
      Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);
      const snap0=Sim.getState(0);
      this.cam.x=snap0.head[0];this.cam.y=snap0.head[1];
      document.getElementById('f-speed').value=this.level.play.speed;
      document.getElementById('f-lead').value=this.level.audio.leadInSec;
      document.getElementById('f-offset').value=this.level.audio.audioOffset||0;
      document.getElementById('f-width').value=this.width;
      this._refreshRouteSelect();
      this._updateStats();
    }).catch(e=>{console.error(e);toast('音频加载失败: '+e.message,5000);});
  },
  _blankLevel(songKey,duration){
    const l=Schema.defaults();l.meta.title=songKey;l.meta.songKey=songKey;
    l.audio.songKey=songKey;l.meta.durationSec=duration;return l;
  },
  exit(){AudioEngine.stopAll();this.playing=false;this._demoMode=false;
    document.getElementById('editor-bar').classList.remove('active');
    document.getElementById('ed-params').classList.remove('active');
    document.getElementById('ed-stats').classList.remove('active');
    document.getElementById('edit-hint').classList.add('hidden');
    document.getElementById('timeline').style.display='none';
    document.getElementById('stage').classList.remove('editor-canvas-offset');
    Renderer.resize();
    UI.showMenu();},
  resize(){
    if(!this.tlCanvas)return;const dpr=Math.min(window.devicePixelRatio||1,2);
    this.tlW=this.tlCanvas.clientWidth;this.tlH=this.tlCanvas.clientHeight;
    this.tlCanvas.width=this.tlW*dpr;this.tlCanvas.height=this.tlH*dpr;
    this.tlCtx.setTransform(dpr,0,0,dpr,0,0);
  },
  syncParams(){
    if(!this.level)return;
    this.level.play.speed=Number(document.getElementById('f-speed').value)||220;
    this.level.audio.leadInSec=Number(document.getElementById('f-lead').value)||2.5;
    this.level.audio.audioOffset=Number(document.getElementById('f-offset').value)||0;
    Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();
  },
  _markDirty(){this.dirty=true;this._updateStats();clearTimeout(this._saveT);this._saveT=setTimeout(()=>Store.autosave(this.level),800);},
  _updateStats(){
    const r=this._activeRoute();
    const t=document.getElementById('st-turns');if(t)t.textContent=r?r.turns.length:0;
    const rt=document.getElementById('st-routes');if(rt)rt.textContent=this.level?this.level.routes.length:1;
    const w=document.getElementById('st-w');if(w)w.textContent=this.width;
  },
  _activeRoute(){return this.level.routes.find(r=>r.id===this.activeRouteId)||this.level.routes[0];},
  _refreshRouteSelect(){
    const sel=document.getElementById('route-select');if(!sel)return;sel.innerHTML='';
    this.level.routes.forEach((r,i)=>{const o=document.createElement('option');o.value=r.id;
      o.textContent=(r.name||('路线 '+r.id))+(i===0?' (主)':'')+' · '+r.turns.length+'点';sel.appendChild(o);});
    sel.value=this.activeRouteId;
    this._refreshRouteColor();
  },
  _refreshRouteColor(){
    const ci=document.getElementById('route-color');if(!ci)return;
    const r=this._activeRoute();if(r&&r.color)ci.value=r.color;
  },
  onStagePointer(e){
    if(this.dragMode)return;
    if(this.camMode){this._addCamKeyframe(e);return;}
    if(this.diamondMode){this._addCollectible('diamond');return;}
    if(this.checkpointMode){this._addCollectible('checkpoint');return;}
    if(this.crownMode){this._addCollectible('crown');return;}
    if(!this.paverMode)return;
    const T=AudioEngine.musicTime;
    this._addTurn(T,this.width);
    toast('转向 @ '+T.toFixed(2)+'s  宽 '+this.width);
  },
  _addCollectible(type){
    if(!this.level.collectibles)this.level.collectibles={checkpoints:[],diamonds:[],crown:null};
    const T=AudioEngine.musicTime;
    const col=this.level.collectibles;
    if(type==='diamond'){
      // Anti-stacking
      if(!col.diamonds.some(d=>Math.abs(d.t-T)<0.3)){
        col.diamonds.push({t:+T.toFixed(3)});col.diamonds.sort((a,b)=>a.t-b.t);
        toast('💎 钻石 @ '+T.toFixed(2)+'s');
      }
    }else if(type==='checkpoint'){
      if(!col.checkpoints.some(c=>Math.abs(c.t-T)<0.5)){
        col.checkpoints.push({t:+T.toFixed(3)});col.checkpoints.sort((a,b)=>a.t-b.t);
        toast('🏁 存档点 @ '+T.toFixed(2)+'s');
      }
    }else if(type==='crown'){
      col.crown={t:+T.toFixed(3)};
      toast('👑 皇冠 @ '+T.toFixed(2)+'s');
    }
    this._markDirty();
  },
  _addTurn(t,w){
    const r=this._activeRoute();
    r.turns.push({t:+t.toFixed(3),w:clamp(w,Config.minHalfWidth,Config.maxHalfWidth)});
    r.turns.sort((a,b)=>a.t-b.t);
    Schema._validateRoute(r,0,this.level.play);
    Sim.reset(this.level,true,this.activeRouteId);this._markDirty();
  },
  _addCamKeyframe(e){
    const [wx,wy]=this._stagePos(e);
    const T=AudioEngine.musicTime,z=this.cam.zoom;
    const kfs=this.level.camera.keyframes;
    // Anti-stacking: if a keyframe exists within 0.1s, replace it
    const existing=kfs.findIndex(k=>Math.abs(k.t-T)<0.1);
    if(existing>=0){
      kfs[existing]={t:+T.toFixed(3),x:wx,y:wy,zoom:z};
      toast('相机关键帧已更新 @ '+T.toFixed(2)+'s');
    }else{
      kfs.push({t:+T.toFixed(3),x:wx,y:wy,zoom:z});
      kfs.sort((a,b)=>a.t-b.t);
      toast('相机关键帧 @ '+T.toFixed(2)+'s');
    }
    this.level.camera.mode='keyframe';
    this._markDirty();
  },
  bindCanvas(){
    if(this._bound)return;this._bound=true;
    const stage=document.getElementById('stage');
    stage.addEventListener('pointerdown',(e)=>this._onStageDown(e));
    stage.addEventListener('pointermove',(e)=>this._onStageMove(e));
    window.addEventListener('pointerup',(e)=>this._onUp(e));
    stage.addEventListener('wheel',(e)=>{e.preventDefault();const f=e.deltaY<0?1.1:0.9;this.cam.zoom=clamp(this.cam.zoom*f,0.15,3);},{passive:false});
    // timeline
    this.tlCanvas.addEventListener('pointerdown',(e)=>this._onTlDown(e));
    this.tlCanvas.addEventListener('pointermove',(e)=>this._onTlMove(e));
    this.tlCanvas.addEventListener('contextmenu',(e)=>{e.preventDefault();this._onTlDelete(e);});
  },
  _stagePos(e){const r=document.getElementById('stage').getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;const z=this.cam.zoom;
    return[(x-Renderer.W/2)/z+this.cam.x,(y-Renderer.H/2)/z+this.cam.y];},
  _tlX(e){const r=this.tlCanvas.getBoundingClientRect();return e.clientX-r.left;},
  _tlY(e){const r=this.tlCanvas.getBoundingClientRect();return e.clientY-r.top;},
  _timeToX(t){const pad=20;return pad+t/(AudioEngine.duration||1)*(this.tlW-pad*2);},
  _xToTime(x){const pad=20;return(x-pad)/(this.tlW-pad*2)*(AudioEngine.duration||1);},
  _onStageDown(e){
    if(!this.level)return;
    // Only pan in drag mode, or right-click always pans
    if(!this.dragMode&&e.button!==2)return;
    this.drag={type:'pan',x:e.clientX,y:e.clientY,cx:this.cam.x,cy:this.cam.y};
  },
  _onStageMove(e){
    if(!this.drag)return;
    if(this.drag.type==='pan'){
      this.cam.x=this.drag.cx-(e.clientX-this.drag.x)/this.cam.zoom;
      this.cam.y=this.drag.cy-(e.clientY-this.drag.y)/this.cam.zoom;
    }
  },
  _onUp(e){this.drag=null;this.tlDrag=null;},
  _onTlDown(e){
    if(!this.level)return;
    const x=this._tlX(e),y=this._tlY(e);
    const camH=24;
    // 顶部相机通道区域 = 拖动播放头(seek)
    if(y<camH){
      const t=clamp(this._xToTime(x),0,AudioEngine.duration||1);
      AudioEngine.seek(t);
      this.tlDrag={type:'seek'};
      return;
    }
    const r=this._activeRoute();
    for(let i=0;i<r.turns.length;i++){
      if(Math.abs(this._timeToX(r.turns[i].t)-x)<7){
        this.tlDrag={type:'turn',idx:i};return;
      }
    }
    const t=clamp(this._xToTime(x),0,AudioEngine.duration||1);
    this._addTurn(t,this.width);
  },
  _onTlMove(e){
    if(!this.tlDrag)return;
    const x=this._tlX(e);
    if(this.tlDrag.type==='seek'){
      const t=clamp(this._xToTime(x),0,AudioEngine.duration||1);
      AudioEngine.seek(t);
      return;
    }
    const t=clamp(this._xToTime(x),0,AudioEngine.duration||1);
    const r=this._activeRoute();
    r.turns[this.tlDrag.idx].t=+t.toFixed(3);
    r.turns.sort((a,b)=>a.t-b.t);
    this.tlDrag.idx=r.turns.findIndex(tp=>Math.abs(tp.t-t)<0.001);
    Schema._validateRoute(r,0,this.level.play);
    Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();
  },
  _onTlDelete(e){
    if(!this.level)return;
    const x=this._tlX(e),y=this._tlY(e);
    const camH=24;
    // 右键顶部区域 = 删除相机关键帧
    if(y<camH&&this.level.camera.keyframes.length>1){
      for(let i=0;i<this.level.camera.keyframes.length;i++){
        if(Math.abs(this._timeToX(this.level.camera.keyframes[i].t)-x)<10){
          this.level.camera.keyframes.splice(i,1);
          if(this.level.camera.keyframes.length<=1)this.level.camera.mode='auto';
          this._markDirty();toast('已删除相机关键帧');
          return;
        }
      }
    }
    // 右键下方区域 = 删除转点
    const r=this._activeRoute();
    for(let i=0;i<r.turns.length;i++){
      if(Math.abs(this._timeToX(r.turns[i].t)-x)<10){
        r.turns.splice(i,1);
        Schema._validateRoute(r,0,this.level.play);
        Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();toast('已删除转点');
        return;
      }
    }
  },
  onKey(e){
    if(e.code==='Space'||e.code==='Enter'){
      e.preventDefault();
      if(this.playing||this._demoMode){
        const T=AudioEngine.musicTime;
        this._addTurn(T,this.width);
        toast('转向 @ '+T.toFixed(2)+'s');
      }else{
        this.togglePlay();
      }
    }
    else if(e.code==='Escape'){if(this.playing||this._demoMode)this.togglePlay();}
    else if(e.code==='Delete'||e.code==='Backspace'){
      if(!this.level)return;
      const r=this._activeRoute();if(!r||r.turns.length===0)return;
      const T=AudioEngine.musicTime;
      let bi=0,bd=Infinity;
      for(let i=0;i<r.turns.length;i++){const d=Math.abs(r.turns[i].t-T);if(d<bd){bd=d;bi=i;}}
      r.turns.splice(bi,1);Schema._validateRoute(r,0,this.level.play);
      Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();toast('已删除最近转点');
    }
  },
  async togglePlay(){
    if(!AudioEngine.buffer)return;
    if(this.playing){AudioEngine.pause();this.playing=false;this._demoMode=false;document.getElementById('ed-play').textContent='▶ 播放';}
    else{await AudioEngine.resumeCtx();AudioEngine.play(AudioEngine.musicTime);this.playing=true;document.getElementById('ed-play').textContent='⏸ 暂停';}
  },
  async autoDemo(){
    if(!AudioEngine.buffer)return;
    AudioEngine.seek(0);await AudioEngine.resumeCtx();AudioEngine.play(0);
    this.playing=true;Sim.reset(this.level,true);this._demoMode=true;
    document.getElementById('ed-play').textContent='⏸ 暂停';
  },
  testPlay(){
    if(!AudioEngine.buffer)return;
    AudioEngine.pause();this.playing=false;this._demoMode=false;
    document.getElementById('editor-bar').classList.remove('active');
    document.getElementById('ed-params').classList.remove('active');
    document.getElementById('ed-stats').classList.remove('active');
    document.getElementById('edit-hint').classList.add('hidden');
    document.getElementById('timeline').style.display='none';
    document.getElementById('stage').classList.remove('editor-canvas-offset');
    Renderer.resize();
    Game._editorReturn=true;Game.startPlay(this.songKey,true,false,this.activeRouteId||null);
  },
  returnFromTest(){
    Game.mode='editor';Game._editorReturn=false;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('pause').classList.add('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('countdown').classList.add('hidden');
    document.getElementById('editor-bar').classList.add('active');
    document.getElementById('ed-params').classList.add('active');
    document.getElementById('ed-stats').classList.add('active');
    document.getElementById('edit-hint').classList.remove('hidden');
    document.getElementById('timeline').style.display='block';
    document.getElementById('stage').classList.add('editor-canvas-offset');
    Renderer.resize();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('play-hint').classList.add('hidden');
    Sim.reset(this.level,true);AudioEngine.seek(0);
  },
  exportLevel(){
    if(!this.level)return;
    this.level.meta.title=this.level.meta.title||this.songKey;
    const data=Schema.serialize(this.level);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=(this.level.meta.title||this.songKey)+'.level.json';
    a.click();URL.revokeObjectURL(url);
    Store.setLevel(this.songKey,this.level);toast('已导出 '+a.download);
  },
  importLevel(e){
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const obj=JSON.parse(r.result);this.level=Schema.validate(obj);
      Sim.reset(this.level,true);
      document.getElementById('f-speed').value=this.level.play.speed;
      document.getElementById('f-lead').value=this.level.audio.leadInSec;
      document.getElementById('f-offset').value=this.level.audio.audioOffset||0;
      this._refreshRouteSelect();
      this._markDirty();toast('关卡已导入');}
      catch(err){toast('导入失败: '+err.message);}};
    r.readAsText(f);e.target.value='';
  },
  clearAll(){
    if(!this.level)return;
    const r=this._activeRoute();
    if(r&&r.turns.length>0&&!confirm('确定清空当前路线所有转点？'))return;
    r.turns=[];r.widths=[this.level.play.halfWidth];
    Schema._validateRoute(r,0,this.level.play);
    Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();toast('已清空');
  },
  _setMode(mode){
    this.paverMode=false;this.camMode=false;this.dragMode=false;
    this.diamondMode=false;this.checkpointMode=false;this.crownMode=false;
    const modes={paver:'mode-paver',cam:'mode-cam',drag:'mode-drag',diamond:'mode-diamond',checkpoint:'mode-checkpoint',crown:'mode-crown'};
    const labels={paver:'铺路模式',cam:'相机模式',drag:'拖动模式',diamond:'💎 钻石模式',checkpoint:'🏁 存档点模式',crown:'👑 皇冠模式'};
    if(mode==='paver')this.paverMode=true;
    else if(mode==='cam')this.camMode=true;
    else if(mode==='drag')this.dragMode=true;
    else if(mode==='diamond')this.diamondMode=true;
    else if(mode==='checkpoint')this.checkpointMode=true;
    else if(mode==='crown')this.crownMode=true;
    for(const k in modes){const el=document.getElementById(modes[k]);if(el)el.classList.toggle('active',k===mode);}
    toast(labels[mode]||mode);
  },
  clearCamera(){
    if(!this.level)return;
    if(this.level.camera.keyframes.length>1&&!confirm('确定清空所有相机关键帧？'))return;
    this.level.camera.keyframes=[{t:0,x:0,y:0,zoom:Config.zoom}];
    this.level.camera.mode='auto';
    Sim.reset(this.level,true,this.activeRouteId||this.level.routes[0].id);this._markDirty();toast('相机已清空');
  },
  clearCollectibles(){
    if(!this.level)return;
    if(!this.level.collectibles)this.level.collectibles={checkpoints:[],diamonds:[],crown:null};
    const has=this.level.collectibles.diamonds.length>0||this.level.collectibles.checkpoints.length>0||this.level.collectibles.crown;
    if(has&&!confirm('确定清空所有收集物？'))return;
    this.level.collectibles={checkpoints:[],diamonds:[],crown:null};
    this._markDirty();toast('收集物已清空');
  },
  update(T,dt){
    Sim.updateParticles(dt);
    const cam=this.level?this.level.camera:null;
    if((this._demoMode||this.playing)&&cam&&cam.mode==='keyframe'&&cam.keyframes.length>1){
      const c=Camera.eval(cam.keyframes,T);
      if(c){Renderer.cam.x=c.x;Renderer.cam.y=c.y;Config.zoom=c.zoom;}
      Renderer.render(Sim.getState(T),'editor');
    }else if(this._demoMode||this.playing){
      const snap=Sim.getState(T);Renderer.setCam(snap.head[0],snap.head[1]);
      Renderer.render(snap,'editor');
    }else{
      Renderer.cam.x=this.cam.x;Renderer.cam.y=this.cam.y;Config.zoom=this.cam.zoom;
      Renderer.render(Sim.getState(T),'editor');
    }
    // Draw camera keyframe markers on stage (editor only, not playing)
    if(!this._demoMode&&!this.playing&&this.level&&this.level.camera.keyframes.length>0){
      this._drawCamKeyframes(T);
    }
    this._drawTimeline(T);
    const st=document.getElementById('st-time');
    if(st)st.textContent=T.toFixed(1)+'s / '+(AudioEngine.duration||0).toFixed(1)+'s';
    if(this._demoMode&&AudioEngine.duration&&T>=AudioEngine.duration-0.05){
      this._demoMode=false;this.playing=false;AudioEngine.seek(0);
      document.getElementById('ed-play').textContent='▶ 播放';
    }
    // 普通播放模式: 音乐结束时自动停止, 防止编辑器"卡"在末尾
    if(this.playing&&!this._demoMode&&AudioEngine.duration&&T>=AudioEngine.duration-0.05){
      this.playing=false;AudioEngine.seek(AudioEngine.duration);
      document.getElementById('ed-play').textContent='▶ 播放';
    }
  },
  _drawCamKeyframes(T){
    const ctx=Renderer.ctx,kfs=this.level.camera.keyframes;
    ctx.save();
    kfs.forEach((k,i)=>{
      const s=Renderer.w2s([k.x,k.y]);
      const isCurrent=Math.abs(k.t-T)<0.05;
      const r=isCurrent?12:8;
      // Outer ring
      ctx.strokeStyle=Config.violet;ctx.lineWidth=2;
      ctx.globalAlpha=isCurrent?1:0.7;
      ctx.beginPath();ctx.arc(s[0],s[1],r,0,Math.PI*2);ctx.stroke();
      // Inner dot
      ctx.fillStyle=Config.violet;ctx.globalAlpha=isCurrent?0.8:0.4;
      ctx.beginPath();ctx.arc(s[0],s[1],3,0,Math.PI*2);ctx.fill();
      // Camera icon (crosshair) for visibility
      ctx.globalAlpha=isCurrent?0.9:0.5;ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(s[0]-r-4,s[1]);ctx.lineTo(s[0]-r+2,s[1]);
      ctx.moveTo(s[0]+r-2,s[1]);ctx.lineTo(s[0]+r+4,s[1]);
      ctx.moveTo(s[0],s[1]-r-4);ctx.lineTo(s[0],s[1]-r+2);
      ctx.moveTo(s[0],s[1]+r-2);ctx.lineTo(s[0],s[1]+r+4);
      ctx.stroke();
      // Time label for current keyframe
      if(isCurrent){
        ctx.globalAlpha=1;ctx.fillStyle=Config.violet;
        ctx.font='11px sans-serif';ctx.textAlign='center';
        ctx.fillText(k.t.toFixed(2)+'s',s[0],s[1]-r-8);
      }
    });
    // Draw interpolation path between keyframes (dashed violet line)
    if(kfs.length>1){
      ctx.globalAlpha=0.3;ctx.strokeStyle=Config.violet;
      ctx.lineWidth=1;ctx.setLineDash([6,4]);
      ctx.beginPath();
      kfs.forEach((k,i)=>{
        const s=Renderer.w2s([k.x,k.y]);
        if(i===0)ctx.moveTo(s[0],s[1]);else ctx.lineTo(s[0],s[1]);
      });
      ctx.stroke();ctx.setLineDash([]);
    }
    ctx.globalAlpha=1;ctx.restore();
  },
  _drawTimeline(T){
    const ctx=this.tlCtx,W=this.tlW,H=this.tlH;if(!W)return;
    ctx.fillStyle='#080a14';ctx.fillRect(0,0,W,H);
    // 摄影机关键帧通道（顶部 24px, 兼作拖动定位条）
    const camH=24;
    ctx.fillStyle='rgba(122,134,255,0.08)';ctx.fillRect(0,0,W,camH);
    ctx.strokeStyle='rgba(122,134,255,0.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,camH);ctx.lineTo(W,camH);ctx.stroke();
    if(this.level&&this.level.camera&&this.level.camera.keyframes.length>0){
      this.level.camera.keyframes.forEach(k=>{
        const x=this._timeToX(k.t);
        ctx.fillStyle=Config.violet;ctx.shadowBlur=6;ctx.shadowColor=Config.violet;
        ctx.beginPath();ctx.moveTo(x,camH/2-5);ctx.lineTo(x+5,camH/2);ctx.lineTo(x,camH/2+5);ctx.lineTo(x-5,camH/2);ctx.closePath();ctx.fill();
      });
      ctx.shadowBlur=0;
    }
    // 波形
    if(AudioEngine.peaks){
      const p=AudioEngine.peaks,n=Config.PEAKS,cy=(H-camH)/2+camH;
      ctx.fillStyle='rgba(122,134,255,0.35)';const colW=W/n;
      for(let i=0;i<n;i++){const x=i*colW,mn=p[i*2],mx=p[i*2+1];
        ctx.fillRect(x,cy+mn*(H-camH)/2*0.9,Math.max(1,colW),(mx-mn)*(H-camH)/2*0.9);}
    }
    // 中线
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,camH+(H-camH)/2);ctx.lineTo(W,camH+(H-camH)/2);ctx.stroke();
    // 时间标尺
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px sans-serif';ctx.textBaseline='top';
    const dur=AudioEngine.duration||1;
    for(let s=0;s<=dur;s+=Math.max(1,Math.round(dur/12))){
      const x=this._timeToX(s);ctx.fillText(s+'s',x+2,camH+2);
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.moveTo(x,camH);ctx.lineTo(x,H);ctx.stroke();
    }
    // 转点（单通道，按路线颜色）
    if(this.level){
      const r=this._activeRoute();
      if(r){
        r.turns.forEach(tp=>{
          const x=this._timeToX(tp.t);
          const c=r.color||Config.cyan;
          const y=camH+(H-camH)/2;
          ctx.fillStyle=c;ctx.shadowBlur=8;ctx.shadowColor=c;
          ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;
        });
      }
      // 收集物标记
      if(this.level.collectibles){
        const y=camH+(H-camH)/2;
        // 钻石
        this.level.collectibles.diamonds.forEach(d=>{
          const x=this._timeToX(d.t);
          ctx.fillStyle='#44ffaa';ctx.shadowBlur=6;ctx.shadowColor='#44ffaa';
          ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+5,y);ctx.lineTo(x,y+6);ctx.lineTo(x-5,y);ctx.closePath();ctx.fill();
          ctx.shadowBlur=0;
        });
        // 存档点
        this.level.collectibles.checkpoints.forEach(c=>{
          const x=this._timeToX(c.t);
          ctx.fillStyle='#44ff88';
          ctx.fillRect(x-2,y-8,4,16);
        });
        // 皇冠
        if(this.level.collectibles.crown){
          const x=this._timeToX(this.level.collectibles.crown.t);
          ctx.fillStyle='#ffd700';ctx.shadowBlur=8;ctx.shadowColor='#ffd700';
          ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;
        }
      }
    }
    // 播放头
    const px=this._timeToX(T);
    ctx.strokeStyle=Config.magenta;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();
    ctx.fillStyle=Config.magenta;
    ctx.beginPath();ctx.moveTo(px-5,0);ctx.lineTo(px+5,0);ctx.lineTo(px,8);ctx.fill();
  }
};

/* ===== OfflinePackager (folder structure, no base64) ===== */
const OfflinePackager={
  _crcTable:(function(){let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})(),
  _crc32(buf){let crc=0xFFFFFFFF;const b=new Uint8Array(buf),t=this._crcTable;for(let i=0;i<b.length;i++)crc=t[(crc^b[i])&0xFF]^(crc>>>8);return(crc^0xFFFFFFFF)>>>0;},
  _u8(s){return new TextEncoder().encode(s);},
  _makeZip(files){
    const parts=[],cdEntries=[];let offset=0;
    for(const f of files){
      const nb=this._u8(f.name),data=f.data,crc=this._crc32(data),size=data.length;
      const lfh=new Uint8Array(30+nb.length),dv=new DataView(lfh.buffer);
      dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
      dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);
      dv.setUint32(14,crc,true);dv.setUint32(18,size,true);dv.setUint32(22,size,true);
      dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);lfh.set(nb,30);
      parts.push(lfh);parts.push(data);
      const cdh=new Uint8Array(46+nb.length),cv=new DataView(cdh.buffer);
      cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
      cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);
      cv.setUint32(16,crc,true);cv.setUint32(20,size,true);cv.setUint32(24,size,true);
      cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
      cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);
      cv.setUint32(42,offset,true);cdh.set(nb,46);
      cdEntries.push(cdh);offset+=lfh.length+size;
    }
    let cdSize=0;for(const c of cdEntries)cdSize+=c.length;
    const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
    ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
    ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
    ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
    return new Blob([...parts,...cdEntries,eocd],{type:'application/zip'});
  },
  async download(){
    const btn=document.getElementById('btn-offline');const orig=btn.textContent;
    if(location.protocol==='file:'){toast('离线打包需要通过本地服务器访问, 请先启动本地服务器 (如 python3 -m http.server)',5000);return;}
    btn.textContent='打包中…';btn.disabled=true;toast('正在打包离线版ZIP，请稍候…');
    try{
      const files=[];
      // 1. Build offline HTML (external file refs, no base64)
      const audioMap={};for(const k of SONG_ORDER)audioMap[k]={src:'audio/'+k+'.mp3'};
      const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      const inject='<script>window.__OFFLINE_AUDIO__='+JSON.stringify(audioMap)+'<\/script>';
      let offline=html.replace('<script>\n(function(){',inject+'\n<script>\n(function(){');
      offline=offline.replace('class="btn ghost" id="btn-offline"','class="btn ghost hidden" id="btn-offline"');
      files.push({name:'dancing-line-offline/dancing-line.html',data:this._u8(offline)});
      // 2. Audio files
      for(const k of SONG_ORDER){
        const m=AudioManifest[k];let buf;
        try{buf=await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('GET',encodeURI(m.src),true);x.responseType='arraybuffer';x.onload=()=>{if(x.status===200||x.status===0)resolve(x.response);else reject(new Error('XHR '+x.status));};x.onerror=()=>reject(new Error('XHR failed'));x.send();});}
        catch(e){const r=await fetch(encodeURI(m.src));buf=await r.arrayBuffer();}
        files.push({name:'dancing-line-offline/audio/'+k+'.mp3',data:new Uint8Array(buf)});
      }
      // 3. Level files
      for(const k of SONG_ORDER){if(EmbeddedLevels[k]){files.push({name:'dancing-line-offline/levels/'+k+'.level.json',data:this._u8(JSON.stringify(EmbeddedLevels[k]))});}}
      // 4. README
      files.push({name:'dancing-line-offline/README.txt',data:this._u8('跳舞的线 · Dancing Line 离线版\n\n使用方法:\n方式一 (推荐): 使用本地服务器\n  Windows: 双击 start-server.bat\n  Mac/Linux: 终端运行 bash start-server.sh\n  然后浏览器打开 http://localhost:8080/dancing-line.html\n\n方式二: 直接双击 dancing-line.html 打开\n  (音频通过后备方案加载, 可能稍慢)\n\n文件夹说明:\n  audio/ - 音乐文件\n  levels/ - 关卡文件\n')});
      // 5. Server scripts
      files.push({name:'dancing-line-offline/start-server.bat',data:this._u8('@echo off\nchcp 65001 >nul\ncd /d "%~dp0"\npython -m http.server 8080\nstart http://localhost:8080/dancing-line.html\n')});
      files.push({name:'dancing-line-offline/start-server.sh',data:this._u8('#!/bin/bash\ncd "$(dirname "$0")"\npython3 -m http.server 8080 &\nopen "http://localhost:8080/dancing-line.html" 2>/dev/null || xdg-open "http://localhost:8080/dancing-line.html" 2>/dev/null\n')});
      // 6. Generate & download ZIP
      const blob=this._makeZip(files);
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='dancing-line.zip';a.click();URL.revokeObjectURL(a.href);
      toast('离线版ZIP已下载！解压后打开 dancing-line.html 即可游玩');
    }catch(e){console.error(e);toast('打包失败: '+e.message);}
    finally{btn.textContent=orig;btn.disabled=false;}
  }
};

/* expose */
window.Sim=Sim;window.AudioEngine=AudioEngine;window.Game=Game;window.Editor=Editor;
window.Play=Play;window.UI=UI;window.OfflinePackager=OfflinePackager;window.Store=Store;
window.SONG_ORDER=SONG_ORDER;window.AudioManifest=AudioManifest;window.Camera=Camera;
window.EmbeddedLevels=EmbeddedLevels;window.Schema=Schema;

/* boot */
window.addEventListener('DOMContentLoaded',()=>Game.boot());
})();
