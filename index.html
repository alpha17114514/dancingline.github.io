<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跳舞的线 · Dancing Line</title>
<style>
  :root{
    --bg:#05060a; --bg2:#0a0d18;
    --cyan:#22e1ff; --magenta:#ff3df0; --violet:#7a86ff;
    --fg:#eaf2ff; --muted:#7b86a8; --line:#1a2036;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #app{position:fixed;inset:0;overflow:hidden}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #stage{z-index:1}
  #timeline{z-index:2;display:none;height:130px;bottom:0;top:auto}
  .overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .hidden{display:none !important}

  /* Menu */
  #menu{background:radial-gradient(circle at 50% 40%,rgba(34,225,255,.08),transparent 60%),var(--bg)}
  #menu h1{font-size:clamp(48px,11vw,128px);font-weight:800;letter-spacing:.12em;
    background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 0 60px rgba(34,225,255,.25);line-height:1}
  #menu .sub{color:var(--muted);letter-spacing:.5em;font-size:14px;margin:10px 0 40px;text-transform:uppercase;padding-left:.5em}
  .menu-buttons{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .btn{cursor:pointer;border:1px solid rgba(122,134,255,.35);background:rgba(18,22,40,.6);
    color:var(--fg);padding:16px 34px;font-size:17px;font-weight:600;letter-spacing:.08em;
    border-radius:4px;transition:all .2s;backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--cyan);box-shadow:0 0 24px rgba(34,225,255,.35);color:var(--cyan)}
  .btn.primary{border-color:var(--cyan);color:var(--cyan)}
  .btn.primary:hover{background:rgba(34,225,255,.12)}
  .btn.ghost{background:transparent}
  #song-select{margin-top:34px;display:flex;flex-direction:column;gap:8px;width:min(420px,86vw);
    max-height:calc(100vh - 280px);overflow-y:auto;padding-right:4px}
  #song-select::-webkit-scrollbar{width:4px}
  #song-select::-webkit-scrollbar-track{background:transparent}
  #song-select::-webkit-scrollbar-thumb{background:rgba(122,134,255,.3);border-radius:2px}
  .song-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:all .18s;background:rgba(10,13,24,.5)}
  .song-item:hover{border-color:var(--violet);transform:translateX(4px)}
  .song-item .nm{font-size:16px;font-weight:600}
  .song-item .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .diff{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
  .diff.normal{color:var(--cyan);border-color:rgba(34,225,255,.3)}
  .back-link{margin-top:22px;color:var(--muted);font-size:13px;cursor:pointer}
  .back-link:hover{color:var(--fg)}

  /* HUD */
  #hud{z-index:5;pointer-events:none;justify-content:flex-start;align-items:stretch;padding:0}
  #hud .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;width:100%}
  #hud-right{display:flex;align-items:center;gap:14px;pointer-events:auto}
  #song-name{font-size:13px;color:var(--muted)}
  #progress-wrap{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
  #progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 12px var(--cyan)}
  .icon-btn{pointer-events:auto;cursor:pointer;width:38px;height:38px;border:1px solid var(--line);
    border-radius:4px;background:rgba(10,13,24,.6);color:var(--fg);font-size:16px;display:flex;
    align-items:center;justify-content:center}
  .icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}

  /* Pause / Result */
  #pause,#result{background:rgba(5,6,10,.82);backdrop-filter:blur(8px);z-index:20}
  .panel{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px}
  .panel h2{font-size:34px;font-weight:800;letter-spacing:.08em}
  .panel .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .stat-line{color:var(--muted);font-size:14px;letter-spacing:.05em}
  .stat-line b{color:var(--fg)}

  /* Countdown */
  #countdown{z-index:15;pointer-events:none}
  #countdown .num{font-size:clamp(80px,20vw,220px);font-weight:800;color:var(--cyan);
    text-shadow:0 0 50px rgba(34,225,255,.6);animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
  @keyframes pulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

  /* Editor */
  #editor-bar{position:absolute;z-index:9;top:0;left:0;right:0;height:46px;display:none;
    align-items:center;gap:8px;padding:0 14px;background:rgba(8,10,20,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  #editor-bar.active{display:flex}
  #editor-bar .nm{font-weight:700;font-size:14px;margin-right:auto}
  .ed-btn{cursor:pointer;border:1px solid var(--line);background:rgba(20,26,46,.6);color:var(--fg);
    padding:6px 14px;border-radius:3px;font-size:13px;transition:all .15s}
  .ed-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .ed-btn.danger:hover{border-color:var(--magenta);color:var(--magenta)}
  .ed-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(34,225,255,.12)}
  .editor-canvas-offset{top:46px !important}
  #ed-params{position:absolute;z-index:7;left:12px;bottom:146px;display:none;flex-direction:column;
    gap:6px;background:rgba(8,10,20,.8);backdrop-filter:blur(6px);padding:10px 14px;border-radius:4px;
    border:1px solid var(--line)}
  #ed-params.active{display:flex}
  #ed-params label{font-size:11px;color:var(--muted)}
  #ed-params input{width:72px;background:rgba(20,26,46,.7);border:1px solid var(--line);color:var(--fg);
    padding:4px 6px;border-radius:3px;font-size:13px;font-family:inherit}
  #ed-stats{position:absolute;z-index:7;right:12px;bottom:146px;display:none;
    background:rgba(8,10,20,.8);backdrop-filter:blur(6px);padding:8px 14px;border-radius:4px;
    border:1px solid var(--line);font-size:12px;color:var(--muted);text-align:right}
  #ed-stats.active{display:block}
  #ed-stats b{color:var(--fg)}

  #toast{position:absolute;z-index:30;bottom:150px;left:50%;transform:translateX(-50%);
    background:rgba(8,10,20,.92);border:1px solid var(--violet);color:var(--fg);padding:10px 18px;
    border-radius:4px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:90vw;white-space:pre-wrap;text-align:center;line-height:1.5}
  #toast.show{opacity:1}
  .hint{position:absolute;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);
    color:var(--muted);font-size:13px;letter-spacing:.06em;pointer-events:none;text-align:center}
  .kbd{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:1px 7px;
    margin:0 2px;color:var(--fg);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <canvas id="timeline"></canvas>

  <div id="menu" class="overlay">
    <h1>跳舞的线</h1>
    <div class="sub">Dancing Line</div>
    <div class="menu-buttons" id="main-buttons">
      <button class="btn primary" id="btn-play">开始游戏</button>
      <button class="btn" id="btn-editor">制作关卡</button>
      <button class="btn ghost" id="btn-offline">下载离线版(ZIP)</button>
    </div>
    <div id="song-select" class="hidden"></div>
    <div class="back-link hidden" id="back-to-main">‹ 返回</div>
  </div>

  <div id="hud" class="overlay hidden">
    <div class="top">
      <div id="song-name"></div>
      <div id="hud-right"><button class="icon-btn" id="btn-pause" title="暂停 (Esc)">II</button></div>
    </div>
    <div id="progress-wrap"><div id="progress-fill"></div></div>
    <div id="collect-hud" style="position:absolute;top:42px;right:12px;display:flex;gap:12px;font-size:14px;z-index:5">
      <span id="diamond-count" style="color:#44ffaa">0/0</span>
      <span id="crown-icon" style="opacity:0.3">👑</span>
    </div>
  </div>

  <div id="countdown" class="overlay hidden"><div class="num">3</div></div>

  <div id="pause" class="overlay hidden">
    <div class="panel"><h2>已暂停</h2>
      <div class="row">
        <button class="btn primary" id="btn-resume">继续</button>
        <button class="btn" id="btn-restart">重新开始</button>
        <button class="btn ghost" id="btn-quit">退出</button>
      </div>
    </div>
  </div>

  <div id="result" class="overlay hidden">
    <div class="panel">
      <h2 id="result-title">游戏结束</h2>
      <div class="stat-line">完成度 <b id="result-progress">0%</b></div>
      <div id="result-score" class="hidden"></div>
      <div class="stat-line hidden"><span id="result-combo"></span></div>
      <div class="stat-line hidden" id="best-line"></div>
      <div class="row">
        <button class="btn primary" id="btn-retry">再来一次</button>
        <button class="btn" id="btn-revive" style="display:none">从存档点继续</button>
        <button class="btn ghost" id="btn-result-quit">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- Editor -->
  <div id="editor-bar">
    <span class="nm" id="editor-song">编辑器</span>
    <button class="ed-btn" id="ed-play">▶ 播放</button>
    <button class="ed-btn" id="ed-demo">自动预览</button>
    <button class="ed-btn" id="ed-test">试玩</button>
    <button class="ed-btn" id="ed-export">导出JSON</button>
    <button class="ed-btn" id="ed-import">导入</button>
    <button class="ed-btn danger" id="ed-clear">清空</button>
    <button class="ed-btn danger" id="ed-clear-cam">清空相机</button>
    <button class="ed-btn danger" id="ed-clear-col">清空收集</button>
    <button class="ed-btn" id="ed-quit">退出</button>
    <input type="file" id="ed-import-file" accept=".json,application/json" class="hidden">
  </div>
  <div id="ed-params">
    <label>速度 <input type="number" id="f-speed" value="220" style="width:60px"></label>
    <label>导引秒 <input type="number" step="0.1" id="f-lead" value="3.0" style="width:60px"></label>
    <label>音频偏移 <input type="number" step="0.05" id="f-offset" value="0" style="width:60px"></label>
    <label>路宽 <input type="range" id="f-width" min="6" max="100" step="1" value="18" style="width:90px;vertical-align:middle"></label>
    <div id="route-tools" style="display:flex;gap:4px;align-items:center;margin-top:4px">
      <select id="route-select" style="background:rgba(20,26,46,.7);border:1px solid var(--line);color:var(--fg);font-size:12px;padding:2px"></select>
      <input type="color" id="route-color" value="#22e1ff" title="路线颜色" style="width:28px;height:24px;border:1px solid var(--line);background:transparent;cursor:pointer;padding:0">
      <button class="ed-btn" id="route-add" style="padding:3px 8px;font-size:11px">+路线</button>
      <button class="ed-btn danger" id="route-del" style="padding:3px 8px;font-size:11px">删</button>
    </div>
    <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
      <button class="ed-btn active" id="mode-paver" style="padding:3px 10px;font-size:11px">铺路</button>
      <button class="ed-btn" id="mode-cam" style="padding:3px 10px;font-size:11px">相机</button>
      <button class="ed-btn" id="mode-drag" style="padding:3px 10px;font-size:11px">拖动</button>
      <button class="ed-btn" id="mode-diamond" style="padding:3px 10px;font-size:11px">💎</button>
      <button class="ed-btn" id="mode-checkpoint" style="padding:3px 10px;font-size:11px">🏁</button>
      <button class="ed-btn" id="mode-crown" style="padding:3px 10px;font-size:11px">👑</button>
    </div>
  </div>
  <div id="ed-stats">
    <div>转向点 <b id="st-turns">0</b> · 路线 <b id="st-routes">1</b> · 路宽 <b id="st-w">18</b></div>
    <div id="st-time">0.0s / 0.0s</div>
  </div>

  <div id="toast"></div>
  <div id="play-hint" class="hint hidden"><span class="kbd">点击</span> 转向 · <span class="kbd">Space/Enter</span> 转向 · <span class="kbd">Esc</span> 暂停 · <span class="kbd">R</span> 重开</div>
  <div id="edit-hint" class="hint hidden" style="bottom:140px"><span class="kbd">点击/Space</span> 铺转向点 · <span class="kbd">拖动模式</span> 平移 · <span class="kbd">💎🏁👑</span> 放收集物 · <span class="kbd">右键</span> 删点 · <span class="kbd">顶部条</span> 拖动定位 · <span class="kbd">相机模式</span> 放关键帧</div>
</div>

<script>
(function(){

function toast(msg,dur){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),dur||1800);}

/* ===== Load level from file (offline ZIP uses levels/ folder) ===== */
async function loadLevelFromFile(songKey){
  try{
    const url=encodeURI('levels/'+songKey+'.level.json');
    const resp=await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      xhr.open('GET',url,true);
      xhr.responseType='text';
      xhr.timeout=10000;
      xhr.onload=()=>{if(xhr.status===200||xhr.status===0)resolve(xhr.responseText);else reject(new Error('XHR '+xhr.status));};
      xhr.onerror=()=>reject(new Error('XHR failed'));
      xhr.ontimeout=()=>reject(new Error('XHR timeout'));
      xhr.send();
    });
    return Schema.validate(JSON.parse(resp));
  }catch(e){console.warn('loadLevelFromFile failed for '+songKey+': '+e.message);return null;}
}

/* ===== AudioEngine ===== */
const AudioEngine={
  ctx:null,buffer:null,source:null,analyser:null,gain:null,
  musicStartTime:0,pausedAt:0,playing:false,manualStop:false,
  timeData:null,peaks:null,duration:0,songKey:null,
  _mediaElement:null,_mediaSource:null,_useMediaElement:false,_mediaNoWebAudio:false,
  async init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.gain=this.ctx.createGain();this.gain.gain.value=0.9;
    this.analyser=this.ctx.createAnalyser();this.analyser.fftSize=2048;
    this.gain.connect(this.analyser);this.analyser.connect(this.ctx.destination);
    this.timeData=new Uint8Array(this.analyser.fftSize);
  },
  async resumeCtx(){if(this.ctx&&this.ctx.state==='suspended')await this.ctx.resume();},
  _cleanupMedia(){
    if(this._mediaElement){try{this._mediaElement.pause();}catch(e){}try{this._mediaElement.src='';}catch(e){}this._mediaElement=null;}
    if(this._mediaSource){try{this._mediaSource.disconnect();}catch(e){}this._mediaSource=null;}
    this._useMediaElement=false;this._mediaNoWebAudio=false;
  },
  async _loadViaMediaElement(songKey,url){
    // 使用 <audio> 元素加载音频 (file:// 协议下 XHR/fetch 会被阻止, 但 <audio> 可以加载本地文件)
    const audio=new Audio();
    audio.src=url;
    audio.preload='auto';
    // 等待元数据加载完成, 获取时长
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('音频加载超时 (15s)')),15000);
      audio.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve();},{once:true});
      audio.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('音频文件无法加载 (可能不存在或格式不支持)'));},{once:true});
      audio.load();
    });
    // 等待可以播放
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>resolve(),5000); // 最多等5秒, 然后直接尝试播放
      audio.addEventListener('canplay',()=>{clearTimeout(timer);resolve();},{once:true});
      audio.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('音频准备播放失败'));},{once:true});
    });
    if(this.ctx&&this.ctx.state==='suspended'){try{await this.ctx.resume();}catch(e){}}
    // 尝试通过 Web Audio API 连接 (可以使用 analyser 等效果)
    try{
      const src=this.ctx.createMediaElementSource(audio);
      src.connect(this.gain);
      this._mediaSource=src;
      this._useMediaElement=true;
      this._mediaNoWebAudio=false;
      console.info('音频通过 MediaElementSource 加载成功: '+songKey);
    }catch(e){
      // createMediaElementSource 失败 (可能是 CORS 限制), 退而使用纯 audio 元素播放
      console.warn('createMediaElementSource failed, using plain audio element: '+e.message);
      this._useMediaElement=true;
      this._mediaNoWebAudio=true;
      // 设置默认音量
      audio.volume=0.9;
    }
    this._mediaElement=audio;
    this.duration=audio.duration||0;
    if(!this.duration||!isFinite(this.duration)){
      // 某些浏览器在 loadedmetadata 时 duration 可能还不准确, 监听 durationchange
      await new Promise(r=>{const t=setTimeout(r,2000);audio.addEventListener('durationchange',()=>{clearTimeout(t);r();},{once:true});});
      this.duration=audio.duration||0;
    }
    this.peaks=null;
    this.songKey=songKey;
    // 创建一个占位 buffer, 使 if(!AudioEngine.buffer) 检查通过
    this.buffer=this.ctx?this.ctx.createBuffer(1,1,44100):{duration:this.duration};
    // 监听播放结束
    audio.addEventListener('ended',()=>{if(!this.manualStop){this.playing=false;this.pausedAt=this.duration;}});
  },
  async load(songKey){
    if(this.songKey!==songKey||!this.buffer){
      // 清理之前的 media element
      this._cleanupMedia();
      const m=AudioManifest[songKey];if(!m)throw new Error('未知曲目 '+songKey);
      const relUrl=encodeURI(m.src);
      let absUrl='';
      try{absUrl=new URL(relUrl,location.href).href;}catch(e){}
      let arr;
      // 第一步: 尝试 XHR 加载 (1次, 避免过多请求加重 SSL 问题)
      let loadErr=null;
      try{
        arr=await new Promise((resolve,reject)=>{
          const xhr=new XMLHttpRequest();
          xhr.open('GET',relUrl,true);
          xhr.responseType='arraybuffer';
          xhr.timeout=30000;
          xhr.onload=()=>{if(xhr.status===200||xhr.status===0)resolve(xhr.response);else reject(new Error('XHR '+xhr.status));};
          xhr.onerror=()=>reject(new Error('网络错误'));
          xhr.ontimeout=()=>reject(new Error('请求超时 (30s)'));
          xhr.send();
        });
      }catch(e){loadErr=e;console.warn('XHR failed for '+songKey+': '+e.message);}
      // 第二步: XHR 失败, 尝试 fetch (1次, 延迟1秒避免连续请求)
      if(loadErr){
        await new Promise(r=>setTimeout(r,1000));
        try{
          const res=await fetch(absUrl||relUrl);if(!res.ok)throw new Error('fetch '+res.status);
          arr=await res.arrayBuffer();loadErr=null;
        }catch(e){console.warn('Fetch failed for '+songKey+': '+e.message);}
      }
      // 第三步: fetch 也失败, 尝试 media element (1次, 延迟1秒)
      if(loadErr){
        await new Promise(r=>setTimeout(r,1000));
        console.warn('XHR and fetch failed for '+songKey+', trying media element...');
        try{
          await this._loadViaMediaElement(songKey,absUrl||relUrl);
          return this.buffer;
        }catch(e){
          loadErr=e;console.warn('Media element failed for '+songKey+': '+e.message);this._cleanupMedia();
        }
      }
      // 所有方法都失败
      if(loadErr){
        const proto=location.protocol;
        let hint;
        if(proto==='https:'){
          hint='音频加载失败 (SSL连接错误)\n建议: 1.刷新页面重试 2.点击主菜单"下载离线版"本地运行';
        }else if(proto==='file:'){
          hint='音频加载失败\n建议: 使用本地服务器运行, 或点击主菜单"下载离线版"';
        }else{
          hint='音频加载失败 ('+loadErr.message+')\n建议: 刷新页面重试, 或下载离线版';
        }
        throw new Error(hint);
      }
      // 第四步: decodeAudioData 解码 (带1次重试)
      let lastErr;
      for(let attempt=0;attempt<2;attempt++){
        try{
          if(this.ctx.state==='suspended'){await this.ctx.resume();}
          this.buffer=await this.ctx.decodeAudioData(arr.slice(0));
          this.duration=this.buffer.duration;this.peaks=this.computePeaks(this.buffer);this.songKey=songKey;
          return this.buffer;
        }catch(e){
          lastErr=e;
          console.warn('decodeAudioData attempt '+(attempt+1)+' failed for '+songKey+': '+e.message);
          if(attempt<1)await new Promise(r=>setTimeout(r,200));
        }
      }
      // 第五步: decodeAudioData 失败, 尝试 media element
      console.warn('decodeAudioData failed, trying media element fallback...');
      try{
        await this._loadViaMediaElement(songKey,relUrl);
        return this.buffer;
      }catch(e3){
        throw new Error('音频解码失败: '+songKey+' ('+(lastErr?lastErr.message:'unknown')+')');
      }

  },
  computePeaks(buf){
    if(!buf||!buf.getChannelData)return null;

    return p;
  },
  get musicTime(){
    if(this._useMediaElement&&this._mediaElement){

      try{this._mediaElement.currentTime=clamp(offset,0,this.duration||0);}catch(e){}
      this._mediaElement.play().catch(e=>console.warn('Media play failed:',e.message));
      this.pausedAt=offset;this.playing=true;
      return;
    }
    this._stopSource();this.source=this._createSource();
    this.manualStop=false;this.musicStartTime=this.ctx.currentTime-offset;this.pausedAt=offset;
    this.source.start(this.ctx.currentTime,clamp(offset,0,this.duration));
    this.source.onended=()=>{if(!this.manualStop){this.playing=false;this.pausedAt=this.duration;}};
    this.playing=true;
  },
  _stopSource(){
    if(this._useMediaElement&&this._mediaElement){
      try{this._mediaElement.pause();}catch(e){}
      return;
    }
    if(this.source){try{this.manualStop=true;this.source.stop();}catch(e){}this.source=null;}
  },
  pause(){
    if(!this.playing)return;
    if(this._useMediaElement&&this._mediaElement){this.pausedAt=this._mediaElement.currentTime;}
    else{this.pausedAt=this.musicTime;}
    this._stopSource();this.playing=false;
  },
  resume(){if(this.playing)return;this.play(this.pausedAt);},
  seek(t){t=clamp(t,0,this.duration);const w=this.playing;this._stopSource();this.pausedAt=t;this.playing=false;if(w)this.play(t);},
  stopAll(){this._stopSource();this.playing=false;this.pausedAt=0;},
  getEnergy(){
    if(this._mediaNoWebAudio||!this.analyser)return 0.3; // 纯 audio 元素模式下返回固定值
    const d=this.timeData;this.analyser.getByteTimeDomainData(d);let s=0;for(let i=0;i<d.length;i++){const v=(d[i]-128)/128;s+=v*v;}return Math.sqrt(s/d.length);
  }
};

/* ===== Schema (v3: Toggle 交替转向, 多路线, 无分数) ===== */
const Schema={
  VERSION:3,
  defaults(){
    return {schemaVersion:3,
      meta:{title:'',songKey:'',difficulty:'normal',durationSec:0,author:'',createdAt:''},
      audio:{songKey:'',leadInSec:3.0,audioOffset:Config.defaultAudioOffset},
      play:{speed:Config.defaultSpeed,startPos:[0,0],startDir:[1,0],
            turnSense:Config.turnSense,
            halfWidth:Config.defaultHalfWidth,
            collisionHalfWidth:Config.defaultHalfWidth+Config.collisionMargin},
      routes:[],
      camera:{keyframes:[{t:0,x:0,y:0,zoom:Config.zoom}],mode:'auto'},
      collectibles:{checkpoints:[],diamonds:[],crown:null}
    };
  },
  defaultRoute(id,play,colorIdx){
    return {id,name:'路线 '+id,color:Config.routeColors[(colorIdx||0)%Config.routeColors.length],
      startPos:play.startPos.slice(),startDir:play.startDir.slice(),
      turnSense:play.turnSense,
      widths:[play.halfWidth],
      turns:[]};
  },
  validate(obj){
    const d=this.defaults();if(!obj||typeof obj!=='object')obj={};
    obj.schemaVersion=3;
    obj.meta=Object.assign({},d.meta,obj.meta||{});
    obj.audio=Object.assign({},d.audio,obj.audio||{});
    obj.audio.audioOffset=Number(obj.audio.audioOffset)||0;
    obj.play=Object.assign({},d.play,obj.play||{});
    obj.play.startPos=[Number(obj.play.startPos?.[0])||0,Number(obj.play.startPos?.[1])||0];
    const sd=obj.play.startDir||[1,0],L=Math.hypot(sd[0],sd[1])||1;
    obj.play.startDir=[sd[0]/L,sd[1]/L];
    obj.play.turnSense=obj.play.turnSense==='R'?'R':'L';
    obj.routes=Array.isArray(obj.routes)?obj.routes.map((r,i)=>this._validateRoute(r,i,obj.play)):[];
    if(obj.routes.length===0)obj.routes.push(this.defaultRoute('r0',obj.play));
    obj.camera=Object.assign({},d.camera,obj.camera||{});
    obj.camera.keyframes=(obj.camera.keyframes||[{t:0,x:0,y:0,zoom:Config.zoom}])
      .map(k=>({t:+Number(k.t)||0,x:Number(k.x)||0,y:Number(k.y)||0,zoom:Number(k.zoom)||Config.zoom}))
      .sort((a,b)=>a.t-b.t);
    obj.camera.mode=obj.camera.mode==='keyframe'?'keyframe':'auto';
    // collectibles
    obj.collectibles=obj.collectibles||{};
    obj.collectibles.checkpoints=Array.isArray(obj.collectibles.checkpoints)?obj.collectibles.checkpoints.map(c=>({t:+Number(c.t).toFixed(3)||0})).sort((a,b)=>a.t-b.t):[];
    obj.collectibles.diamonds=Array.isArray(obj.collectibles.diamonds)?obj.collectibles.diamonds.map(d=>({t:+Number(d.t).toFixed(3)||0})).sort((a,b)=>a.t-b.t):[];
    obj.collectibles.crown=obj.collectibles.crown?{t:+Number(obj.collectibles.crown.t).toFixed(3)||0}:null;
    return obj;
  },
  _validateRoute(r,i,play){
    r=r||{};r.id=r.id||('r'+i);r.name=r.name||('路线 '+r.id);r.color=r.color||Config.routeColors[i%Config.routeColors.length];
    r.startPos=[Number(r.startPos?.[0])||play.startPos[0],Number(r.startPos?.[1])||play.startPos[1]];
    const sd=r.startDir||play.startDir,L=Math.hypot(sd[0],sd[1])||1;
    r.startDir=[sd[0]/L,sd[1]/L];
    r.turnSense=r.turnSense==='R'?'R':(r.turnSense==='L'?'L':play.turnSense);
    r.turns=(r.turns||[]).map(t=>({t:+Number(t.t).toFixed(3)||0,w:clamp(Number(t.w)||play.halfWidth,Config.minHalfWidth,Config.maxHalfWidth)}))
      .sort((a,b)=>a.t-b.t);
    const w0=clamp(Number(r.widths?.[0])||play.halfWidth,Config.minHalfWidth,Config.maxHalfWidth);
    r.widths=r.turns.map((t,k)=>clamp(Number(r.widths?.[k+1])||t.w||play.halfWidth,Config.minHalfWidth,Config.maxHalfWidth));
    r.widths.unshift(w0);
    return r;
  },
  serialize(level){return JSON.stringify(this.validate(JSON.parse(JSON.stringify(level))),null,2);}
};

/* ===== 路径构建 (v3: Toggle 交替) ===== */
function routeDirs(route){
  const a=[route.startDir[0],route.startDir[1]];
  const b=route.turnSense==='R'?turnRight(a):turnLeft(a);
  return [a,b];
}
function buildRoutePath(route,speed,leadIn){
  const [a,b]=routeDirs(route);
  const turns=route.turns;
  const nodeTimes=[-leadIn,...turns.map(t=>t.t)];
  const segDirs=[];for(let i=0;i<nodeTimes.length;i++)segDirs.push(i%2===0?a:b);
  const prefix=[route.startPos.slice()];
  for(let i=0;i<nodeTimes.length-1;i++){
    const dt=nodeTimes[i+1]-nodeTimes[i];
    prefix.push([prefix[i][0]+segDirs[i][0]*speed*dt,prefix[i][1]+segDirs[i][1]*speed*dt]);
  }
  const widths=route.widths&&route.widths.length===prefix.length
    ?route.widths.slice()
    :(()=>{const w=[];for(let i=0;i<prefix.length;i++)w.push(route.widths?.[0]||Config.defaultHalfWidth);return w;})();
  return {nodeTimes,segDirs,prefix,widths,dirA:a,dirB:b};
}

/* ===== 自动生成Demo关卡 ===== */
function generateDemoLevel(songKey,duration){
  const leadIn=3.0,interval=1.6,speed=Config.defaultSpeed;
  const numTurns=Math.min(80,Math.max(16,Math.floor((duration)/interval)));
  const level=Schema.defaults();
  level.meta.title=songKey;level.meta.songKey=songKey;
  level.audio.songKey=songKey;level.audio.leadInSec=leadIn;
  level.play.speed=speed;
  const route=Schema.defaultRoute('r0',level.play);
  for(let i=1;i<=numTurns;i++){
    const w=Config.defaultHalfWidth+Math.floor(Math.random()*8-4);
    route.turns.push({t:+(i*interval).toFixed(3),w:clamp(w,Config.minHalfWidth,Config.maxHalfWidth)});
  }
  Schema._validateRoute(route,0,level.play);
  level.routes=[route];
  return level;
}

/* ===== Sim (v3: 无分数, Toggle 交替) ===== */
const Sim={
  level:null,designPath:null,activeRoute:null,allDesignPaths:[],currentRoute:null,
  playerTurns:[],playerPath:null,
  alive:true,autoplay:false,completed:false,
  prevHead:null,head:null,dir:null,particles:[],
  checkpoint:0,collectedDiamonds:new Set(),crownCollected:false,
  reset(level,autoplay,activeRouteId){
    this.level=Schema.validate(level);
    this.autoplay=!!autoplay;
    this.activeRoute=this.level.routes.find(r=>r.id===activeRouteId)||this.level.routes[0];
    this.designPath=buildRoutePath(this.activeRoute,this.level.play.speed,this.level.audio.leadInSec);
    // 预计算所有路线的 designPath, 用于多路线碰撞检测
    this.allDesignPaths=this.level.routes.map(r=>({
      route:r,
      path:buildRoutePath(r,this.level.play.speed,this.level.audio.leadInSec)
    }));
    this.currentRoute=this.activeRoute;
    this.playerTurns=[];
    this._rebuildPlayer();
    this.alive=true;this.completed=false;
    this.particles=[];
    this.checkpoint=0;this.collectedDiamonds=new Set();this.crownCollected=false;
    this.prevHead=this.designPath.prefix[0].slice();
    this.head=this.designPath.prefix[0].slice();
    this.dir=this.designPath.dirA;
  },
  setActiveRoute(routeId){
    if(!this.level)return;
    const r=this.level.routes.find(x=>x.id===routeId);
    if(r){this.activeRoute=r;this.currentRoute=r;this.designPath=buildRoutePath(r,this.level.play.speed,this.level.audio.leadInSec);
      this.allDesignPaths=this.level.routes.map(rt=>({
        route:rt,
        path:buildRoutePath(rt,this.level.play.speed,this.level.audio.leadInSec)
      }));
      this._rebuildPlayer();this.prevHead=this.designPath.prefix[0].slice();
      this.head=this.designPath.prefix[0].slice();this.dir=this.designPath.dirA;}
  },
  _rebuildPlayer(){
    const dp=this.designPath,sp=this.activeRoute.startPos,speed=this.level.play.speed;
    const leadIn=this.level.audio.leadInSec;
    const nodeTimes=[-leadIn,...this.playerTurns.map(t=>t.t)];
    const segDirs=[];for(let i=0;i<nodeTimes.length;i++)segDirs.push(i%2===0?dp.dirA:dp.dirB);
    const prefix=[sp.slice()];
    for(let i=0;i<nodeTimes.length-1;i++){
      const dt=nodeTimes[i+1]-nodeTimes[i];
      prefix.push([prefix[i][0]+segDirs[i][0]*speed*dt,prefix[i][1]+segDirs[i][1]*speed*dt]);
    }
    // 使用当前路线的宽度, 若未确定则用活动路线宽度
    const cr=this.currentRoute||this.activeRoute;
    const crPath=this.allDesignPaths.find(e=>e.route.id===cr.id);
    const widthSource=(crPath&&crPath.path.widths)||dp.widths;
    const widths=widthSource.slice(0,prefix.length);
    while(widths.length<prefix.length)widths.push(widths[widths.length-1]);
    this.playerPath={nodeTimes,segDirs,prefix,widths,dirA:dp.dirA,dirB:dp.dirB};
  },
  _sample(path,T){
    const{nodeTimes,segDirs,prefix}=path;
    if(T<=nodeTimes[0])return{head:prefix[0].slice(),dir:segDirs[0],idx:0};
    let lo=0,hi=nodeTimes.length-1;
    while(lo<hi){const m=(lo+hi+1)>>1;if(nodeTimes[m]<=T)lo=m;else hi=m-1;}
    const i=lo,local=T-nodeTimes[i];
    return{head:[prefix[i][0]+segDirs[i][0]*this.level.play.speed*local,
                 prefix[i][1]+segDirs[i][1]*this.level.play.speed*local],dir:segDirs[i],idx:i};
  },
  getState(T){
    if(!this.level||!this.playerPath){
      const h=this.head||[0,0];
      return{head:h,dir:this.dir||[1,0],trail:[h],alive:false,completed:false,
        progress:0,turnCount:0,autoplay:!!this.autoplay,T,idx:0,widths:[],dirA:[1,0],dirB:[0,1],routeColor:Config.cyan};
    }
    const path=this.autoplay?this.designPath:this.playerPath;
    const s=this._sample(path,T);
    return this._snapshot(T,s,path);
  },
  _snapshot(T,s,path){
    const trail=[];
    for(let i=0;i<=s.idx;i++)trail.push(path.prefix[i]);
    trail.push(s.head);
    const dur=AudioEngine.duration||0;
    // 进度: 取 gameTime 和 musicTime 的较大值, 确保音乐结束时进度到达 100%
    const mt=AudioEngine.playing?AudioEngine.musicTime:0;
    const progress=dur?clamp(Math.max(T,mt)/dur,0,1):0;
    return{head:s.head,dir:s.dir,trail,alive:this.alive,completed:this.completed,
      progress,turnCount:this.playerTurns.length,autoplay:this.autoplay,T,idx:s.idx,
      widths:path.widths,dirA:path.dirA,dirB:path.dirB,routeColor:(this.currentRoute||this.activeRoute).color};
  },
  onTurn(T){
    if(!this.alive||this.autoplay)return false;
    if(T<0)return false;
    const cr=this.currentRoute||this.activeRoute;
    this.playerTurns.push({t:T,w:cr.widths?.[this.playerTurns.length+1]||this.level.play.halfWidth});
    this._rebuildPlayer();
    return true;
  },
  checkCollision(T){
    if(!this.alive||this.autoplay)return false;
    const ps=this._sample(this.playerPath,T);
    // 多路线模式: 检查玩家是否在任意一条路线上
    let minDist=Infinity,closestRoute=null;
    for(const entry of this.allDesignPaths){
      const ds=this._sample(entry.path,T);
      const dist=Math.hypot(ps.head[0]-ds.head[0],ps.head[1]-ds.head[1]);
      const segHalf=Math.max(entry.path.widths[ds.idx]||0,entry.path.widths[ds.idx+1]||0);
      const tol=segHalf+Config.collisionMargin;
      if(dist<=tol&&dist<minDist){minDist=dist;closestRoute=entry.route;}
    }
    if(closestRoute){
      // 玩家在某条路线上, 更新当前路线 (用于颜色和宽度)
      this.currentRoute=closestRoute;
      return false;
    }
    return true;
  },
  spawnParticles(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*180;this.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6+Math.random()*0.4,max:1,color});}},
  updateParticles(dt){for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;if(p.life<=0)this.particles.splice(i,1);}},
  // 检查收集物: 返回 {checkpoint?,diamond?,crown?}
  checkCollectibles(T){
    if(!this.level||!this.level.collectibles)return{};
    const col=this.level.collectibles;const result={};
    // 存档点: 到达时间点时激活
    if(col.checkpoints&&col.checkpoints.length>0){
      for(let i=this.checkpoint;i<col.checkpoints.length;i++){
        if(T>=col.checkpoints[i].t){
          this.checkpoint=i+1;result.checkpoint=col.checkpoints[i].t;
        }
      }
    }
    // 钻石: 玩家路径接近当前路线上的钻石位置时收集
    if(col.diamonds&&col.diamonds.length>0){
      const cr=this.currentRoute||this.activeRoute;
      const crEntry=this.allDesignPaths.find(e=>e.route.id===cr.id);
      const dp=crEntry?crEntry.path:this.designPath;
      const ds=this._sample(dp,T);
      for(const d of col.diamonds){
        if(this.collectedDiamonds.has(d.t))continue;
        if(Math.abs(T-d.t)<0.15){
          const dIdx=Math.min(dp.prefix.length-1,dp.nodeTimes.findIndex(nt=>nt>=d.t));
          if(dIdx<0)continue;
          const dx=dp.prefix[dIdx][0]-ds.head[0];
          const dy=dp.prefix[dIdx][1]-ds.head[1];
          if(Math.hypot(dx,dy)<(dp.widths[dIdx]||Config.defaultHalfWidth)+20){
            this.collectedDiamonds.add(d.t);result.diamond=d.t;
            this.spawnParticles(ds.head[0],ds.head[1],'#44ffaa',12);
          }
        }
      }
    }
    // 皇冠: 到达终点附近时收集
    if(col.crown&&!this.crownCollected&&T>=col.crown.t-0.3&&T<=col.crown.t+0.5){
      this.crownCollected=true;result.crown=col.crown.t;
      const cr=this.currentRoute||this.activeRoute;
      const crEntry=this.allDesignPaths.find(e=>e.route.id===cr.id);
      const dp=crEntry?crEntry.path:this.designPath;
      const ds=this._sample(dp,T);
      this.spawnParticles(ds.head[0],ds.head[1],'#ffd700',20);
    }
    return result;
  },
  // 从最近存档点恢复
  getCheckpointTime(){
    if(!this.level||!this.level.collectibles||!this.level.collectibles.checkpoints)return 0;
    const cps=this.level.collectibles.checkpoints;
    if(this.checkpoint<=0)return 0;
    return cps[Math.min(this.checkpoint-1,cps.length-1)].t;
  }
};

/* ===== Camera (关键帧摄影机) ===== */
const Camera={
  eval(kfs,T){
    if(!kfs||!kfs.length)return null;
    if(T<=kfs[0].t)return{x:kfs[0].x,y:kfs[0].y,zoom:kfs[0].zoom};
    const last=kfs[kfs.length-1];if(T>=last.t)return{x:last.x,y:last.y,zoom:last.zoom};
    let i=0;while(i<kfs.length-1&&kfs[i+1].t<=T)i++;
    const a=kfs[i],b=kfs[i+1];const u=(T-a.t)/((b.t-a.t)||1);
    const e=Config.camKeyframeSmooth?smoothstep(u):u;
    return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e),zoom:lerp(a.zoom,b.zoom,e)};
  }
};

/* ===== Renderer ===== */
const Renderer={
  canvas:null,ctx:null,W:0,H:0,dpr:1,cam:{x:0,y:0},shake:0,bgPulse:0,_bgGrad:null,_bgPulseCache:-1,_energyFrame:0,_energyCache:0,
  init(){this.canvas=document.getElementById('stage');this.ctx=this.canvas.getContext('2d');this.resize();},
  resize(){this.dpr=Math.min(window.devicePixelRatio||1,2);this.W=this.canvas.clientWidth;this.H=this.canvas.clientHeight;
    this.canvas.width=this.W*this.dpr;this.canvas.height=this.H*this.dpr;this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);this._bgGrad=null;},
  setCam(x,y){this.cam.x=lerp(this.cam.x,x,Config.camFollow);this.cam.y=lerp(this.cam.y,y,Config.camFollow);},
  snapCam(x,y){this.cam.x=x;this.cam.y=y;},
  w2s(p){const z=Config.zoom;return[(p[0]-this.cam.x)*z+this.W/2,(p[1]-this.cam.y)*z+this.H/2];},
  // 批量世界坐标→屏幕坐标
  w2sBatch(pts){const z=Config.zoom,cx=this.cam.x,cy=this.cam.y,hw=this.W/2,hh=this.H/2;const out=new Array(pts.length);
    for(let i=0;i<pts.length;i++)out[i]=[(pts[i][0]-cx)*z+hw,(pts[i][1]-cy)*z+hh];return out;},
  // 视口裁剪: 判断屏幕坐标是否在可见范围内(含margin)
  _visible(sx,sy,m){return sx>-m&&sx<this.W+m&&sy>-m&&sy<this.H+m;},
  render(snap,mode){
    const ctx=this.ctx;
    // 节流 getEnergy: 每3帧才读一次analyser
    this._energyFrame++;
    if(this._energyFrame>=3){this._energyFrame=0;this._energyCache=AudioEngine.playing?AudioEngine.getEnergy():0;}
    const energy=this._energyCache;
    this.bgPulse=lerp(this.bgPulse,energy,0.2);
    const p=this.bgPulse;
    // 缓存背景渐变(仅在pulse变化较大时重建)
    const pIdx=Math.round(p*20);
    if(!this._bgGrad||pIdx!==this._bgPulseCache){
      this._bgPulseCache=pIdx;
      this._bgGrad=ctx.createLinearGradient(0,0,0,this.H);
      this._bgGrad.addColorStop(0,`rgb(${(7+p*18)|0},${(9+p*12)|0},${(18+p*28)|0})`);
      this._bgGrad.addColorStop(1,'#04050a');
    }
    ctx.fillStyle=this._bgGrad;ctx.fillRect(0,0,this.W,this.H);
    ctx.save();
    // 网格(仅绘制可见范围内的线)
    const z=Config.zoom;
    const sx0=(0-this.cam.x)*z+this.W/2,sy0=(0-this.cam.y)*z+this.H/2;
    ctx.strokeStyle='rgba(122,134,255,0.06)';ctx.lineWidth=1;const step=64*z;
    ctx.beginPath();
    const xStart=sx0-Math.ceil(sx0/step)*step;
    for(let x=xStart;x<this.W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,this.H);}
    const yStart=sy0-Math.ceil(sy0/step)*step;
    for(let y=yStart;y<this.H;y+=step){ctx.moveTo(0,y);ctx.lineTo(this.W,y);}
    ctx.stroke();
    if(this.shake>0){const s=this.shake;ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);this.shake*=0.86;if(this.shake<0.3)this.shake=0;}
    // 设计路径(编辑器或幽灵)
    if(mode==='editor'&&Sim.level&&Sim.level.routes.length>1){
      // 编辑器: 渲染所有路线, 非活动路线用暗色
      for(const route of Sim.level.routes){
        const isActive=route.id===Sim.activeRoute.id;
        const path=buildRoutePath(route,Sim.level.play.speed,Sim.level.audio.leadInSec);
        if(!isActive)this._drawRoad(path.prefix,path.widths,route.color||'#888',0.3,false);
      }
      // 活动路线用正常亮度和自身颜色
      if(Sim.designPath)this._drawDesignPath(Sim.designPath,false,Sim.activeRoute.color);
    }else if(mode==='play'&&Sim.level&&Sim.level.routes.length>1){
      // 游戏模式: 所有路线等亮度显示, 玩家可走任意一条
      for(const route of Sim.level.routes){
        const path=buildRoutePath(route,Sim.level.play.speed,Sim.level.audio.leadInSec);
        this._drawRoad(path.prefix,path.widths,route.color||'#888',0.3,false);
      }
    }else if((mode==='editor'||mode==='play')&&Sim.designPath){
      this._drawDesignPath(Sim.designPath,mode==='play',Sim.activeRoute?Sim.activeRoute.color:null);
    }
    // 引导线（仅游戏模式）
    if(mode==='play'&&Game.showGuide&&snap){
      this._drawGuide(snap);
    }
    // 拖尾
    if(snap&&snap.trail&&snap.trail.length>1)this._drawTrail(snap);
    // 粒子(无shadowBlur,用alpha渐变模拟)
    for(const pp of Sim.particles){
      const s=this.w2s([pp.x,pp.y]);const a=clamp(pp.life/pp.max,0,1);
      ctx.globalAlpha=a*0.8;ctx.fillStyle=pp.color;
      ctx.beginPath();ctx.arc(s[0],s[1],2.5*a+1,0,Math.PI*2);ctx.fill();
    }
    // 收集物
    if(mode==='play'&&Sim.level&&Sim.level.collectibles){
      this._drawCollectibles(snap.T,mode);
    }
    ctx.globalAlpha=1;ctx.restore();
  },
  _drawRoad(prefix,widths,color,alpha,glow){
    const ctx=this.ctx;ctx.save();ctx.globalAlpha=alpha;
    const z=Config.zoom,m=80;
    // 预计算所有屏幕坐标
    const scr=this.w2sBatch(prefix);
    // 1. 先绘制矩形段
    ctx.beginPath();
    for(let i=0;i<prefix.length-1;i++){
      const p0=scr[i],p1=scr[i+1];
      // 视口裁剪: 跳过完全不可见的段
      if(!this._visible(p0[0],p0[1],m)&&!this._visible(p1[0],p1[1],m))continue;
      const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      const w0=(widths[i]||Config.defaultHalfWidth)*z,w1=(widths[i+1]||Config.defaultHalfWidth)*z;
      ctx.moveTo(p0[0]+nx*w0,p0[1]+ny*w0);
      ctx.lineTo(p1[0]+nx*w1,p1[1]+ny*w1);
      ctx.lineTo(p1[0]-nx*w1,p1[1]-ny*w1);
      ctx.lineTo(p0[0]-nx*w0,p0[1]-ny*w0);
      ctx.closePath();
    }
    ctx.fillStyle=color;ctx.fill();
    // 2. 转角圆形: 纯色实心填充, 确保转角处无缝隙
    for(let i=1;i<prefix.length-1;i++){
      const p=scr[i];
      if(!this._visible(p[0],p[1],m))continue;
      const w=(widths[i]||Config.defaultHalfWidth)*z;
      ctx.beginPath();
      ctx.arc(p[0],p[1],w,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
    }
    // 3. 起点圆形: 确保只有1个点(无转弯)的路线也可见
    if(prefix.length===1||prefix.length>=2){
      const p0=scr[0];
      if(this._visible(p0[0],p0[1],m)){
        const w=(widths[0]||Config.defaultHalfWidth)*z;
        ctx.beginPath();
        ctx.arc(p0[0],p0[1],w,0,Math.PI*2);
        ctx.fillStyle=color;
        ctx.fill();
      }
    }
    if(glow){
      ctx.globalAlpha=alpha*0.4;ctx.strokeStyle=color;ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let i=0;i<prefix.length-1;i++){
        const p0=scr[i],p1=scr[i+1];
        if(!this._visible(p0[0],p0[1],m)&&!this._visible(p1[0],p1[1],m))continue;
        const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy)||1;
        const nx=-dy/len,ny=dx/len;
        const w0=(widths[i]||Config.defaultHalfWidth)*z,w1=(widths[i+1]||Config.defaultHalfWidth)*z;
        ctx.moveTo(p0[0]+nx*w0,p0[1]+ny*w0);
        ctx.lineTo(p1[0]+nx*w1,p1[1]+ny*w1);
        ctx.lineTo(p1[0]-nx*w1,p1[1]-ny*w1);
        ctx.lineTo(p0[0]-nx*w0,p0[1]-ny*w0);
        ctx.closePath();
      }
      ctx.stroke();
    }
    ctx.restore();
  },
  _drawCollectibles(T_play,mode){
    if(!Sim.level||!Sim.level.collectibles)return;
    const col=Sim.level.collectibles;
    // 使用当前路线的 designPath 来定位收集物
    const cr=Sim.currentRoute||Sim.activeRoute;
    const crEntry=Sim.allDesignPaths.find(e=>e.route.id===cr.id);
    const dp=crEntry?crEntry.path:Sim.designPath;if(!dp)return;
    const ctx=this.ctx,z=Config.zoom;
    ctx.save();
    // 存档点: 绿色旗帜
    if(col.checkpoints){
      for(let i=0;i<col.checkpoints.length;i++){
        const cp=col.checkpoints[i];
        if(T_play<cp.t-0.5)continue; // 还没到时间不显示
        // 找到存档点对应的设计路径位置
        const idx=Math.min(dp.prefix.length-1,Math.max(0,dp.nodeTimes.findIndex(nt=>nt>=cp.t)));
        if(idx<0)continue;
        const s=this.w2s(dp.prefix[idx]);
        const passed=Sim.checkpoint>i;
        ctx.globalAlpha=passed?0.3:0.9;
        ctx.fillStyle=passed?'#555':'#44ff88';
        // 旗帜形状
        ctx.beginPath();
        ctx.moveTo(s[0],s[1]-12*z);
        ctx.lineTo(s[0]+10*z,s[1]-7*z);
        ctx.lineTo(s[0],s[1]-2*z);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='#44ff88';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(s[0],s[1]-12*z);ctx.lineTo(s[0],s[1]+4*z);ctx.stroke();
      }
    }
    // 钻石: 青绿色菱形
    if(col.diamonds){
      for(const d of col.diamonds){
        if(Sim.collectedDiamonds.has(d.t))continue;
        const idx=Math.min(dp.prefix.length-1,Math.max(0,dp.nodeTimes.findIndex(nt=>nt>=d.t)));
        if(idx<0)continue;
        const s=this.w2s(dp.prefix[idx]);
        const pulse=0.8+0.2*Math.sin(performance.now()/300);
        ctx.globalAlpha=pulse;
        ctx.fillStyle='#44ffaa';
        ctx.beginPath();
        ctx.moveTo(s[0],s[1]-8*z);
        ctx.lineTo(s[0]+6*z,s[1]);
        ctx.lineTo(s[0],s[1]+8*z);
        ctx.lineTo(s[0]-6*z,s[1]);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='#88ffcc';ctx.lineWidth=1.5;ctx.stroke();
      }
    }
    // 皇冠: 金色
    if(col.crown&&!Sim.crownCollected){
      const idx=Math.min(dp.prefix.length-1,Math.max(0,dp.nodeTimes.findIndex(nt=>nt>=col.crown.t)));
      if(idx>=0){
        const s=this.w2s(dp.prefix[idx]);
        const pulse=0.8+0.2*Math.sin(performance.now()/200);
        ctx.globalAlpha=pulse;
        ctx.fillStyle='#ffd700';
        const sz=10*z;
        ctx.beginPath();
        ctx.moveTo(s[0]-sz,s[1]+sz/2);
        ctx.lineTo(s[0]-sz,s[1]-sz/2);
        ctx.lineTo(s[0]-sz/2,s[1]+sz/4);
        ctx.lineTo(s[0],s[1]-sz);
        ctx.lineTo(s[0]+sz/2,s[1]+sz/4);
        ctx.lineTo(s[0]+sz,s[1]-sz/2);
        ctx.lineTo(s[0]+sz,s[1]+sz/2);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='#ffaa00';ctx.lineWidth=1.5;ctx.stroke();
      }
    }
    ctx.globalAlpha=1;ctx.restore();
  },
  _drawGuide(snap){
    // 使用当前路线的 designPath
    const cr=Sim.currentRoute||Sim.activeRoute;
    const crEntry=Sim.allDesignPaths.find(e=>e.route.id===cr.id);
    const dp=crEntry?crEntry.path:Sim.designPath;
    if(!dp)return;
    const idx=snap.idx;
    const ctx=this.ctx;ctx.save();
    const z=Config.zoom,m=80;
    // 预计算屏幕坐标
    const scr=this.w2sBatch(dp.prefix);
    // 1. 白色方框+圆形描边: 批量合并, 仅可见段
    ctx.globalAlpha=Config.guideAlpha;
    ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<dp.prefix.length-1;i++){
      const p0=scr[i],p1=scr[i+1];
      if(!this._visible(p0[0],p0[1],m)&&!this._visible(p1[0],p1[1],m))continue;
      const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      const w0=dp.widths[i]*z,w1=dp.widths[i+1]*z;
      ctx.moveTo(p0[0]+nx*w0,p0[1]+ny*w0);
      ctx.lineTo(p1[0]+nx*w1,p1[1]+ny*w1);
      ctx.lineTo(p1[0]-nx*w1,p1[1]-ny*w1);
      ctx.lineTo(p0[0]-nx*w0,p0[1]-ny*w0);
      ctx.closePath();
    }
    for(let i=1;i<dp.prefix.length-1;i++){
      const p=scr[i];
      if(!this._visible(p[0],p[1],m))continue;
      const w=dp.widths[i]*z;
      ctx.moveTo(p[0]+w,p[1]);
      ctx.arc(p[0],p[1],w,0,Math.PI*2);
    }
    ctx.stroke();
    // 2. 白色虚线: 路径中心线(仅可见段)
    ctx.globalAlpha=Config.guideAlpha*1.5;
    ctx.strokeStyle='#ffffff';ctx.setLineDash([10,8]);ctx.lineWidth=2;
    ctx.beginPath();
    const start=Math.max(0,idx);
    let started=false;
    for(let i=start;i<dp.prefix.length;i++){
      const p=scr[i];
      if(!this._visible(p[0],p[1],m+100)){if(started)break;continue;}
      if(!started){ctx.moveTo(p[0],p[1]);started=true;}else ctx.lineTo(p[0],p[1]);
    }
    ctx.stroke();ctx.setLineDash([]);
    // 3. 下一转点标记
    if(idx<dp.prefix.length-1){
      const b=scr[idx+1];
      if(this._visible(b[0],b[1],m)){
        ctx.globalAlpha=1;ctx.fillStyle='#ffffff';
        ctx.beginPath();ctx.arc(b[0],b[1],6,0,Math.PI*2);ctx.fill();
        // 外圈描边模拟发光
        ctx.globalAlpha=0.4;ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(b[0],b[1],9,0,Math.PI*2);ctx.stroke();
      }
    }
    ctx.restore();
  },
  _drawDesignPath(path,isGhost,routeColor){
    if(!path||!path.prefix)return;
    const alpha=isGhost?0.15:0.35;
    this._drawRoad(path.prefix,path.widths,routeColor||Config.cyan,alpha,!isGhost);
  },
  _drawTrail(snap){
    if(!snap.trail||snap.trail.length<2)return;
    const widths=snap.widths&&snap.widths.length>=snap.trail.length
      ?snap.widths.slice(0,snap.trail.length)
      :snap.trail.map(()=>Config.defaultHalfWidth);
    this._drawRoad(snap.trail,widths,snap.routeColor||Config.cyan,0.5,true);
    const ctx=this.ctx,h=this.w2s(snap.head);
    ctx.save();
    if(Renderer.bgPulse>0.04){
      const pr=8+Renderer.bgPulse*24;
      ctx.strokeStyle=`rgba(255,61,240,${Renderer.bgPulse*0.6})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(h[0],h[1],pr,0,Math.PI*2);ctx.stroke();
    }
    // 头部: 外圈描边+填充, 无shadowBlur
    ctx.fillStyle=Config.magenta;
    ctx.beginPath();ctx.arc(h[0],h[1],7,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.35;ctx.strokeStyle=Config.magenta;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(h[0],h[1],10,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(h[0],h[1],3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
};

const UI={
  show(id){document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));const el=document.getElementById(id);if(el)el.classList.remove('hidden');},
  showMenu(){
    AudioEngine.stopAll();
    // 如果使用了 media element 模式 (file:// 协议后备), 清理缓存以使下次重新加载
    // 否则占位 buffer 会导致跳过加载, 但 media element 已被暂停/清理, 音频无法播放
    if(AudioEngine._useMediaElement){
      AudioEngine._cleanupMedia();
      AudioEngine.buffer=null;AudioEngine.songKey=null;AudioEngine.duration=0;AudioEngine.peaks=null;
    }
    // 重置 Play 状态, 防止退出后残留状态影响下次进入
    Play.state='idle';Play.musicStarted=false;Play.gameTime=0;

    document.getElementById('ed-params').classList.remove('active');
    document.getElementById('ed-stats').classList.remove('active');
    document.getElementById('edit-hint').classList.add('hidden');
    document.getElementById('timeline').style.display='none';
    document.getElementById('stage').classList.remove('editor-canvas-offset');
    Renderer.resize();
    document.getElementById('song-select').classList.add('hidden');
    document.getElementById('main-buttons').classList.remove('hidden');
    document.getElementById('back-to-main').classList.add('hidden');
    document.getElementById('play-hint').classList.add('hidden');
    this.show('menu');Game.mode='menu';
  },
  showSongSelect(forEditor){
    document.getElementById('main-buttons').classList.add('hidden');
    const ss=document.getElementById('song-select');ss.classList.remove('hidden');
    document.getElementById('back-to-main').classList.remove('hidden');ss.innerHTML='';
    SONG_ORDER.forEach(key=>{
      const div=document.createElement('div');div.className='song-item';
      // 检查是否有多条路线
      const saved=Store.getLevel(key);
      const embedded=EmbeddedLevels[key];
      const levelData=saved&&saved.routes&&saved.routes[0]&&saved.routes[0].turns.length>0?saved:embedded;
      const routeCount=levelData?levelData.routes.length:1;
      const routeInfo=routeCount>1?` · ${routeCount}条路线`:'';
      div.innerHTML=`<div><div class="nm">${key}</div><div class="meta">钢琴曲 · 点击${forEditor?'进入编辑':'开始游玩'}${routeInfo}</div></div><span class="diff normal">normal</span>`;
      div.onclick=()=>{
        if(forEditor){Editor.enter(key);return;}
        // 游玩模式: 所有路线同时显示, 直接开始
        this.openSongForPlay(key);
      };
      ss.appendChild(div);
    });
  },
  _showRouteSelect(songKey,routes){
    const ss=document.getElementById('song-select');
    ss.innerHTML='';
    // 返回按钮
    const back=document.createElement('div');back.className='song-item';back.style.cursor='pointer';
    back.innerHTML='<div><div class="nm">← 返回歌曲列表</div></div>';
    back.onclick=()=>this.showSongSelect(false);
    ss.appendChild(back);
    // 标题
    const title=document.createElement('div');title.className='song-item';title.style.cursor='default';title.style.opacity='0.6';
    title.innerHTML=`<div><div class="nm">${songKey} - 选择路线</div></div>`;
    ss.appendChild(title);
    // 路线列表
    routes.forEach((r,i)=>{
      const div=document.createElement('div');div.className='song-item';
      const turnCount=r.turns?r.turns.length:0;
      div.innerHTML=`<div><div class="nm" style="color:${r.color}">路线 ${i+1}: ${r.name||r.id}</div><div class="meta">${turnCount}个转点 · 宽度${r.widths?(r.widths[1]||r.widths[0]||18):18}</div></div><span class="diff normal">normal</span>`;
      div.onclick=()=>{this.openSongForPlay(songKey,r.id);};
      ss.appendChild(div);
    });
  },
  openSongForPlay(key,routeId){Game.pendingSong=key;document.getElementById('menu').classList.add('hidden');Game.startPlay(key,false,false,routeId);},
  refreshHud(snap){
    document.getElementById('progress-fill').style.width=(snap.progress*100)+'%';
    // 显示收集物计数
    const dc=document.getElementById('diamond-count');
    if(dc){
      const total=Sim.level&&Sim.level.collectibles?Sim.level.collectibles.diamonds.length:0;
      dc.textContent=Sim.collectedDiamonds.size+'/'+total;
    }
    const cc=document.getElementById('crown-icon');
    if(cc)cc.style.opacity=Sim.crownCollected?'1':'0.3';
  },
  toastCollect(msg){
    const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1200);
  }
};

  async startPlay(songKey,fromEditor,autoplay,routeId){
    await AudioEngine.resumeCtx();this.mode='play';this.showGuide=true;
    Play.state='idle';
    document.getElementById('menu').classList.add('hidden');

      if(fromEditor&&Editor.level)level=Schema.validate(Editor.level);
